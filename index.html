        }

        function closeModal() {
            const b = document.getElementById('modal-backdrop'), c = document.getElementById('modal-content');
            if (b && c) {
                b.classList.add('opacity-0');
                c.classList.add('translate-y-full', 'opacity-0');
                setTimeout(() => { document.getElementById('modal-container').innerHTML = ""; }, 300);
            }
        }

        const createFormInput = (id, label, value = "", type = "text") => `<div class="mb-4"><label for="${id}" class="block text-sm font-medium mb-1 text-[--text-secondary]">${label}</label><input type="${type}" id="${id}" name="${id}" value="${value}" required class="w-full px-3 py-2 border border-[--border-color] rounded-md bg-[--bg-color] text-[--text-primary] focus:ring-[--sims-green-vibrant] focus:border-[--sims-green-vibrant]"></div>`;
        const createFormSelect = (id, label, options, selectedValue = "") => `<div class="mb-4"><label for="${id}" class="block text-sm font-medium mb-1 text-[--text-secondary]">${label}</label><select id="${id}" name="${id}" required class="w-full px-3 py-2 border border-[--border-color] rounded-md bg-[--bg-color] text-[--text-primary] focus:ring-[--sims-green-vibrant] focus:border-[--sims-green-vibrant]">${options.map(opt => `<option value="${opt.value}" ${opt.disabled ? 'disabled' : ''} ${String(opt.value) === String(selectedValue) ? 'selected' : ""}>${opt.text}</option>`).join("")}</select></div>`;

        function normalizeEmployment(employmentData) {
            if (!employmentData) return [];
            if (Array.isArray(employmentData)) return employmentData;
            if (typeof employmentData === 'object' && employmentData !== null) return [employmentData];
            return [];
        }

        async function handleFormSubmit(form) {
            const { action, id } = form.dataset;
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);
            const regionId = data.regionId === 'null' ? null : data.regionId;

            try {
                switch (action) {
                    case 'process-apply-fine': {
                        const amount = parseFloat(data.amount);
                        const targetSim = state.residents.find(r => r.id === data.targetId);
                        const targetBiz = state.businesses.find(b => b.id === data.targetId);
                        const isPublic = targetBiz?.isPublicBody || false;

                        const batch = writeBatch(db);
                        if (targetSim) {
                            batch.update(doc(db, "residents", data.targetId), { balance: (targetSim.balance || 0) - amount });
                        } else if (targetBiz) {
                            if (isPublic) {
                                batch.update(doc(db, "config", "finance"), { treasuryBalance: (state.financeConfig.treasuryBalance || 0) - amount });
                            } else {
                                batch.update(doc(db, "businesses", data.targetId), { balance: (targetBiz.balance || 0) - amount });
                            }
                        }

                        const fineRef = doc(collection(db, "fines"));
                        batch.set(fineRef, {
                            targetId: data.targetId,
                            amount: amount,
                            reason: data.reason,
                            isPublic: isPublic,
                            date: serverTimestamp()
                        });
                        await batch.commit();
                        alert("Multa aplicada com sucesso!");
                    } break;

                    case 'process-transfer-sim-to-biz': {
                        const sim = state.residents.find(r => r.id === data.simId);
                        const biz = state.businesses.find(b => b.id === data.bizId);
                        const amount = parseFloat(data.amount);
                        if (sim.balance < amount) { alert("Saldo insuficiente."); return; }
                        const batch = writeBatch(db);
                        batch.update(doc(db, "residents", data.simId), { balance: sim.balance - amount });
                        batch.update(doc(db, "businesses", data.bizId), { balance: (biz.balance || 0) + amount });
                        await batch.commit();
                        alert("Transferência realizada!");
                    } break;

                    case 'process-transfer-sim-to-sim': {
                        const sim = state.residents.find(r => r.id === data.simId);
                        const target = state.residents.find(r => r.id === data.targetSimId);
                        const amount = parseFloat(data.amount);
                        if (sim.balance < amount) { alert("Saldo insuficiente."); return; }
                        const batch = writeBatch(db);
                        batch.update(doc(db, "residents", data.simId), { balance: sim.balance - amount });
                        batch.update(doc(db, "residents", data.targetSimId), { balance: (target.balance || 0) + amount });
                        await batch.commit();
                        alert("Transferência realizada!");
                    } break;

                    case 'update-branch-job-salary': {
                        const sim = state.residents.find(r => r.id === data.residentId);
                        const newEmployment = sim.employment.map(j => {
                            if (j.businessId === data.businessId && j.branchId === data.branchId) return { ...j, salary: parseFloat(data.salary) };
                            return j;
                        });
                        await updateDoc(doc(db, "residents", data.residentId), { employment: newEmployment });
                    } break;

                    case 'process-mass-assign': {
                        const targetIds = formData.getAll('targetIds');
                        const expense = state.fixedExpensesList[parseInt(data.expenseIndex)];
                        const batch = writeBatch(db);
                        targetIds.forEach(target => {
                            const [type, tid] = target.split('|');
                            if (type === 'resident') {
                                const sim = state.residents.find(r => r.id === tid);
                                batch.update(doc(db, "residents", tid), { fixedExpenses: [...(sim.fixedExpenses || []), expense] });
                            } else {
                                const biz = state.businesses.find(b => b.id === tid);
                                batch.update(doc(db, "businesses", tid), { fixedExpenses: [...(biz.fixedExpenses || []), expense] });
                            }
                        });
                        await batch.commit();
                        alert("Atribuição em massa concluída!");
                    } break;
                    case 'save-plan': {
                        const bizRef = doc(db, "businesses", data.bizId);
                        const biz = state.businesses.find(b => b.id === data.bizId);
                        const plans = biz.plans || [];
                        plans.push({ name: data.name, value: parseFloat(data.value || 0) });
                        await updateDoc(bizRef, { plans });
                    } break;
                    case 'save-subscription': {
                        const [pName, pVal] = data.planData.split('|');
                        const [sType, sId] = data.subscriberData.split('|');
                        await addDoc(collection(db, "subscriptions"), {
                            providerId: data.providerId,
                            subscriberType: sType,
                            subscriberId: sId,
                            planName: pName,
                            planValue: parseFloat(pVal),
                            createdAt: serverTimestamp()
                        });
                    } break;
                    case 'process-inject-treasury': {
                        const newBal = (state.financeConfig.treasuryBalance || 0) + parseFloat(data.amount || 0);
                        await updateDoc(doc(db, "config", "finance"), { treasuryBalance: newBal });
                    } break;
                    case 'process-spend-treasury': {
                        const newBal = (state.financeConfig.treasuryBalance || 0) - parseFloat(data.amount || 0);
                        await updateDoc(doc(db, "config", "finance"), { treasuryBalance: newBal });
                    } break;
                    case 'update-gov-salary': {
                        const sals = { ...state.government.salaries };
                        sals[data.officeId] = parseFloat(data.salary || 0);
                        await setDoc(doc(db, "government", "salaries"), sals);
                    } break;
                    case 'process-create-loan': {
                        const amount = parseFloat(data.amount);
                        const bankRef = doc(db, "businesses", data.bankId);
                        const borrowerType = state.residents.some(r => r.id === data.borrowerId) ? 'residents' : 'businesses';
                        const borrowerRef = doc(db, borrowerType, data.borrowerId);
                        const bankDoc = await getDoc(bankRef);
                        const borrowerDoc = await getDoc(borrowerRef);
                        const batch = writeBatch(db);
                        batch.update(bankRef, { balance: (bankDoc.data().balance || 0) - amount });
                        batch.update(borrowerRef, { balance: (borrowerDoc.data().balance || 0) + amount });
                        const newLoanRef = doc(collection(db, "loans"));
                        batch.set(newLoanRef, {
                            bankId: data.bankId,
                            borrowerId: data.borrowerId,
                            borrowerType: borrowerType,
                            totalAmount: amount,
                            interestRate: parseFloat(data.interestRate),
                            totalInstallments: parseInt(data.installments),
                            currentInstallment: 0,
                            remainingAmount: amount + (amount * (parseFloat(data.interestRate)/100)),
                            createdAt: serverTimestamp()
                        });
                        await batch.commit();
                        alert("Empréstimo concedido!");
                    } break;
                    case 'process-zero-balances': {
                        const batch = writeBatch(db);
                        state.residents.forEach(r => batch.update(doc(db, "residents", r.id), { balance: 0 }));
                        state.businesses.forEach(b => batch.update(doc(db, "businesses", b.id), { balance: 0 }));
                        await batch.commit();
                        alert("Todos os saldos foram zerados.");
                    } break;
                    case 'process-reset-central-bank': {
                        const batch = writeBatch(db);
                        state.residents.forEach(r => {
                            const newEmployment = (r.employment || []).map(j => ({ ...j, salary: 0 }));
                            batch.update(doc(db, "residents", r.id), { balance: 0, employment: newEmployment });
                        });

        async function processFinanceCycle() {
            const batch = writeBatch(db);
            const taxesResident = state.taxes.filter(t => t.category === 'resident');
            const taxesBusiness = state.taxes.filter(t => t.category === 'business');
            const costOfLivingRate = (state.financeConfig.costOfLiving || 0) / 100;
            const foodTaxRate = (state.financeConfig.foodTax || 0) / 100;
            let totalTaxRevenue = 0;
            let totalGovSalaries = 0;
            let currentCirculating = 0;
            let treasuryNewBalance = state.financeConfig.treasuryBalance || 0;

            // 1. Empréstimos
            state.loans.forEach(loan => {
                const borrowerRef = doc(db, loan.borrowerType, loan.borrowerId);
                const bankRef = doc(db, "businesses", loan.bankId);
                const installmentAmount = loan.remainingAmount / (loan.totalInstallments - loan.currentInstallment);
                const borrower = loan.borrowerType === 'residents' ? state.residents.find(r => r.id === loan.borrowerId) : state.businesses.find(b => b.id === loan.borrowerId);
                const bank = state.businesses.find(b => b.id === loan.bankId);
                if (borrower && bank) {
                    batch.update(borrowerRef, { balance: (borrower.balance || 0) - installmentAmount });
                    batch.update(bankRef, { balance: (bank.balance || 0) + installmentAmount });
                    if (loan.currentInstallment + 1 >= loan.totalInstallments) batch.delete(doc(db, "loans", loan.id));
                    else batch.update(doc(db, "loans", loan.id), { currentInstallment: loan.currentInstallment + 1, remainingAmount: loan.remainingAmount - installmentAmount });
                }
            });

            // 2. Assinaturas
            state.subscriptions.forEach(sub => {
                const provider = state.businesses.find(b => b.id === sub.providerId);
                if (!provider) return;
                const cost = sub.planValue || 0;
                if (sub.subscriberType === 'resident') {
                    const s = state.residents.find(r => r.id === sub.subscriberId);
                    if (s) batch.update(doc(db, "residents", s.id), { balance: (s.balance || 0) - cost });
                } else if (sub.subscriberType === 'business') {
                    const b = state.businesses.find(x => x.id === sub.subscriberId);
                    if (b) batch.update(doc(db, "businesses", b.id), { balance: (b.balance || 0) - cost });
                } else if (sub.subscriberType === 'treasury') { treasuryNewBalance -= cost; }
                if (provider.isPublicBody) { treasuryNewBalance += cost; } else { batch.update(doc(db, "businesses", provider.id), { balance: (provider.balance || 0) + cost }); }
            });

            // 3. Moradores
            state.residents.filter(r => !r.isDeceased).forEach(sim => {
                let currentBalance = sim.balance || 0;
                let totalSalaryFromPrivate = (sim.employment || []).reduce((acc, job) => acc + (job.salary || 0), 0);
                const ministryId = Object.keys(state.government.roles).find(k => state.government.roles[k] === sim.id);
                if (ministryId) {
                    const govSal = state.government.salaries?.[ministryId] || 0;
                    currentBalance += govSal;
                    totalGovSalaries += govSal;
                }
                currentBalance += totalSalaryFromPrivate;
                
                // Gastos Fixos Híbridos
                let totalFixedExp = (sim.fixedExpenses || []).reduce((acc, ex) => {
                    const val = ex.type === 'percent' ? currentBalance * (ex.value / 100) : (ex.value || 0);
                    return acc + val;
                }, 0);
                currentBalance -= totalFixedExp;

                const autoExpenses = currentBalance * (costOfLivingRate + foodTaxRate);
                currentBalance -= autoExpenses;
                
                taxesResident.forEach(tax => {
                    const deduction = currentBalance * (tax.rate / 100);
                    currentBalance -= deduction;
                    totalTaxRevenue += deduction;
                });

                state.specialTaxes.forEach(st => {
                    if (st.targetIds?.includes(sim.id)) {
                        const deduction = currentBalance * (st.rate / 100);
                        currentBalance -= deduction;
                        totalTaxRevenue += deduction;
                    }
                });
                currentCirculating += currentBalance;
                batch.update(doc(db, "residents", sim.id), { balance: currentBalance });
            });

            // 4. Empresas
            state.businesses.forEach(biz => {
                let currentBalance = biz.balance || 0;
                
                // Gastos Fixos Híbridos
                let totalFixedExp = (biz.fixedExpenses || []).reduce((acc, ex) => {
                    const val = ex.type === 'percent' ? currentBalance * (ex.value / 100) : (ex.value || 0);
                    return acc + val;
                }, 0);

                const employees = state.residents.filter(r => !r.isDeceased && r.employment?.some(j => j.businessId === biz.id));
                const totalPayroll = employees.reduce((acc, emp) => {
                    const myJobs = emp.employment.filter(j => j.businessId === biz.id);
                    return acc + myJobs.reduce((innerAcc, job) => innerAcc + (job.salary || 0), 0);
                }, 0);

                if (biz.isPublicBody || biz.sector === 'Governamental') {
                    totalGovSalaries += totalPayroll;
                } else {
                    currentBalance -= totalPayroll;
                    currentBalance -= totalFixedExp;
                    taxesBusiness.forEach(tax => {
                        const deduction = currentBalance * (tax.rate / 100);
                        currentBalance -= deduction;
                        totalTaxRevenue += deduction;
                    });
                    // Empresas agora podem sofrer impostos especiais
                    state.specialTaxes.forEach(st => {
                        if (st.targetIds?.includes(biz.id)) {
                            const deduction = currentBalance * (st.rate / 100);
                            currentBalance -= deduction;
                            totalTaxRevenue += deduction;
                        }
                    });
                }
                currentCirculating += currentBalance;
                batch.update(doc(db, "businesses", biz.id), { balance: currentBalance });
            });

            const externalRevenue = parseFloat(state.financeConfig.externalRevenueValue || 0);
            treasuryNewBalance = treasuryNewBalance + totalTaxRevenue + externalRevenue - totalGovSalaries;
            batch.update(doc(db, "config", "finance"), { lastCycle: serverTimestamp(), totalCirculating: currentCirculating, treasuryBalance: treasuryNewBalance });
            const histRef = doc(collection(db, "treasuryHistory"));
            batch.set(histRef, { date: serverTimestamp(), totalCollected: totalTaxRevenue, totalSpent: totalGovSalaries, externalRevenue: externalRevenue, balance: treasuryNewBalance });
            await batch.commit();
            alert(`Ciclo Financeiro concluído!`);
        }

        async function processVote(voterId, candidateId) {
            const currentVotes = state.election.votes || [];
            const newVotes = [...currentVotes, { voterId, candidateId }];

        async function finalizeElection(winnerId) {
            const { type, ministryId, ministryName, isTestMode, votes, candidates, round } = state.election;
            if (!isTestMode) {
                const voteCount = (votes || []).reduce((acc, v) => { acc[v.candidateId] = (acc[v.candidateId] || 0) + 1; return acc; }, {});
                await addDoc(collection(db, "electionHistory"), { type, ministryId, ministryName, winnerId, winnerVotes: voteCount[winnerId] || 0, totalVotes: (votes || []).length, votes: (votes || []), candidates: (candidates || []), date: serverTimestamp(), round: round || 1 });
                if (type === 'prefeito') await handleAppointMinister('prefeito', 'Prefeito(a)', winnerId);
                else await handleAppointMinister(ministryId, ministryName, winnerId);
            }
            await setDoc(doc(db, "election", "current"), { isActive: false });
        }

        function generateElectionReport() {
            const { votes, candidates, type, ministryName, round } = state.election;
            const typeLabel = type === 'prefeito' ? 'Prefeito(a)' : `Ministro(a) (${ministryName})`;
            const roundLabel = round === 2 ? '2º Turno' : '1º Turno';
            const curVotes = votes || [];
            let out = `### RELATÓRIO PARCIAL DE ELEIÇÃO: ${typeLabel} - ${roundLabel}\n\n`;
            const results = (candidates || []).map(c => {
                const sim = state.residents.find(x => x.id === c.id);
                const party = state.parties.find(p => p.id === sim?.partyId);
                const myVotes = curVotes.filter(v => v.candidateId === c.id);
                const votersNames = myVotes.map(v => { const vs = state.residents.find(x => x.id === v.voterId); return vs ? `${vs.firstName} ${vs.lastName}` : 'Anônimo'; });
                return { name: sim ? `${sim.firstName} ${sim.lastName}` : 'Desconhecido', party: party ? party.name : 'Sem Partido', count: myVotes.length, voters: votersNames };
            }).sort((a,b) => b.count - a.count);
            results.forEach(res => { out += `CANDIDATO: ${res.name} (${res.party})\nVOTOS: ${res.count}\nVOTANTES: ${res.voters.join(", ") || 'Nenhum'}\n\n`; });
            state.currentPage = 'register'; render();
            const textarea = document.getElementById('report-textarea');
            const output = document.getElementById('report-output');
            if (textarea && output) { textarea.value = out; output.classList.remove('hidden'); }
        }

        async function handleProcessRemoval(resId, reason) {
            if (reason === 'Morreu') await updateDoc(doc(db, "residents", resId), { isDeceased: true, deathDate: new Date(), employment: [] });
            else {
                await deleteDoc(doc(db, "residents", resId));
                state.residents.forEach(async r => {
                    if (r.relationships?.some(rel => rel.residentId === resId)) {
                        const newRels = r.relationships.filter(rel => rel.residentId !== resId);
                        await updateDoc(doc(db, "residents", r.id), { relationships: newRels });
                    }
                });
            }
            state.currentPage = 'dashboard'; render();
        }

        async function handleHire(bizId, brId, resId, pos, sal) {
            const resRef = doc(db, "residents", resId);
            const resDoc = await getDoc(resRef);
            const currentJobs = normalizeEmployment(resDoc.data()?.employment);
            currentJobs.push({ businessId: bizId, branchId: brId, position: pos, salary: sal });
            await updateDoc(resRef, { employment: currentJobs });
        }

        async function handleRemoveEmployee(residentId, businessId, reason) {
            const residentRef = doc(db, "residents", residentId);
            const residentDoc = await getDoc(residentRef);
            const resident = residentDoc.data(); if (!resident) return;
            const newEmployment = normalizeEmployment(resident.employment).filter(job => job.businessId !== businessId);
            const updates = { employment: newEmployment };
            if (reason !== 'Apenas remoção') {
                const business = state.businesses.find(b => b.id === businessId);
                const historyEntry = { id: crypto.randomUUID(), type: 'job', status: reason, location: business ? business.name : 'Empresa Desconhecida', date: new Date() };
                updates.history = [...(resident.history || []), historyEntry];
            }
            await updateDoc(residentRef, updates);
        }

        async function handleRemoveMinister(residentId, officeId, officeName, reason) {
            const batch = writeBatch(db);
            const residentRef = doc(db, "residents", residentId);
            const residentDoc = await getDoc(residentRef);
            const resident = residentDoc.data(); if (!resident) return;
            const newRoles = { ...state.government.roles };
            delete newRoles[officeId]; batch.set(doc(db, "government", "roles"), newRoles);
            const updates = { governmentRole: null };
            if (reason !== 'Apenas remoção') {
                const historyEntry = { id: crypto.randomUUID(), type: 'government', status: reason, location: officeName, date: new Date() };
                updates.history = [...(resident.history || []), historyEntry];
            }
            batch.update(residentRef, updates); await batch.commit();
        }

        async function handleDeleteHistoryEntry(residentId, historyId) {
            const residentRef = doc(db, "residents", residentId);
            const residentDoc = await getDoc(residentRef);
            const resident = residentDoc.data(); if (!resident || !resident.history) return;
            const newHistory = resident.history.filter(entry => entry.id !== historyId);
            await updateDoc(residentRef, { history: newHistory });
        }

        async function handleDeleteResident(id) {
            const batch = writeBatch(db); batch.delete(doc(db, "residents", id));
            state.residents.forEach(r => {
                if (r.id !== id && r.relationships?.some(rel => rel.residentId === id)) {
                    const newRelationships = r.relationships.filter(rel => rel.residentId !== id);
                    batch.update(doc(db, "residents", r.id), { relationships: newRelationships });
                }
            });
            const ownedBusiness = state.businesses.find(b => b.ownerId === id);
            if (ownedBusiness) batch.update(doc(db, "businesses", ownedBusiness.id), { ownerId: null });
            const partyPresident = state.parties.find(p => p.id === id);
            if (partyPresident) batch.update(doc(db, "parties", partyPresident.id), { presidentId: null });
            Object.entries(state.government.roles || {}).forEach(([roleId, holderId]) => {
                if (holderId === id) {
                    const newRoles = { ...state.government.roles };
                    delete newRoles[roleId]; batch.set(doc(db, "government", "roles"), newRoles);
                }
            });
            state.councils.forEach(c => {
                if (c.presidentId === id) batch.update(doc(db, "councils", c.id), { presidentId: null });
                if (c.councilorIds?.includes(id)) {
                    const newCouncilors = c.councilorIds.filter(cid => cid !== id);
                    batch.update(doc(db, "councils", c.id), { councilorIds: newCouncilors });
                }
            });
            await batch.commit();
        }

        async function handleDeleteRegion(id) {
            const batch = writeBatch(db); batch.delete(doc(db, "regions", id));
            state.residents.forEach(r => { if (r.regionId === id) batch.update(doc(db, "residents", r.id), { regionId: null }); });
            state.businesses.forEach(b => { if (b.regionId === id) batch.update(doc(db, "businesses", b.id), { regionId: null }); });
            await batch.commit();
        }

        async function updateResidentCouncilRoles(batch, residentId, councilId, councilName, newRole) {
            if (!residentId) return;
            const residentRef = doc(db, "residents", residentId);
            const resDoc = await getDoc(residentRef);
            const resident = resDoc.data(); if (!resident) return;
            let councilRoles = resident.councilRoles || [];
            councilRoles = councilRoles.filter(r => r.councilId !== councilId);
            if (newRole) councilRoles.push({ councilId, councilName, role: newRole });
            batch.update(residentRef, { councilRoles });
        }

        async function handleAddCouncil(data) {
            const presidentId = data.presidentId === 'null' ? null : data.presidentId;
            const batch = writeBatch(db);
            const newCouncilRef = doc(collection(db, "councils"));
            batch.set(newCouncilRef, { name: data.name, presidentId, councilorIds: [], createdAt: serverTimestamp() });
            if (presidentId) await updateResidentCouncilRoles(batch, presidentId, newCouncilRef.id, data.name, 'Presidente');
            await batch.commit();
        }

        async function handleEditCouncil(id, data) {
            const batch = writeBatch(db);
            const councilRef = doc(db, "councils", id);
            const oldCouncil = state.councils.find(c => c.id === id);
            const newPresidentId = data.presidentId === 'null' ? null : data.presidentId;
            batch.update(councilRef, { name: data.name, presidentId: newPresidentId });
            if (oldCouncil.presidentId !== newPresidentId) {
                if (oldCouncil.presidentId) await updateResidentCouncilRoles(batch, oldCouncil.presidentId, id, oldCouncil.name, null);
                if (newPresidentId) await updateResidentCouncilRoles(batch, newPresidentId, id, data.name, 'Presidente');
            }
            await batch.commit();
        }

        async function handleDeleteCouncil(id) {
            const batch = writeBatch(db);
            const councilToDelete = state.councils.find(c => c.id === id); if (!councilToDelete) return;
            batch.delete(doc(db, "councils", id));
            const memberIds = [councilToDelete.presidentId, ...(councilToDelete.councilorIds || [])].filter(Boolean);
            for (const memberId of memberIds) await updateResidentCouncilRoles(batch, memberId, id, councilToDelete.name, null);
            await batch.commit();
        }

        async function handleAddCouncilor(councilId, residentId) {
            const batch = writeBatch(db);
            const councilRef = doc(db, "councils", councilId);
            const council = state.councils.find(c => c.id === councilId); if (!council || !residentId) return;
            const councilorIds = [...(council.councilorIds || []), residentId];
            batch.update(councilRef, { councilorIds });
            await updateResidentCouncilRoles(batch, residentId, councilId, council.name, 'Conselheiro(a)');
            await batch.commit();
        }

        async function handleRemoveCouncilorWithReason(residentId, councilId, reason) {
            const batch = writeBatch(db);
            const councilRef = doc(db, "councils", councilId);
            const council = state.councils.find(c => c.id === councilId); if (!council) return;
            const newCouncilorIds = (council.councilorIds || []).filter(id => id !== residentId);
            batch.update(councilRef, { councilorIds: newCouncilorIds });
            await updateResidentCouncilRoles(batch, residentId, councilId, council.name, null);
            if (reason !== 'Apenas remoção') {
                const residentRef = doc(db, "residents", residentId);
                const resDoc = await getDoc(residentRef);
                const resident = resDoc.data();
                if (resident) {
                     const historyEntry = { id: crypto.randomUUID(), type: 'politics', status: reason, location: `Conselho: ${council.name}`, date: new Date() };
                     batch.update(residentRef, { history: [...(resident.history || []), historyEntry] });
                }
            }
            await batch.commit();
        }

        async function handleAddStudent(businessId, residentId, course, status) {
            const residentRef = doc(db, "residents", residentId);
            const resDoc = await getDoc(residentRef);
            const newEducation = { businessId, course, status };
            if (!resDoc.exists()) throw new Error('Morador não encontrado.');
            const updated = [...(resDoc.data().education || [])];
            if (updated.some(edu => edu.businessId === businessId && edu.course === course)) throw new Error('Matrícula já cadastrada neste curso.');
            updated.push(newEducation); await updateDoc(residentRef, { education: updated });
        }

            const resA = state.residents.find(s => s.id === simAId);
            await updateDoc(doc(db, "residents", simAId), { relationships: [...(resA.relationships || []), { residentId: simBId, type: type }] });
        }

        async function handleDeleteRelationship(residentId, index) {
            const sim = state.residents.find(r => r.id === residentId); if (!sim) return;
            const newRels = [...(sim.relationships || [])];
            if (!Number.isInteger(index) || index < 0 || index >= newRels.length) return;

        async function handleEditBusiness(id, data) {
            const oldBiz = state.businesses.find(b => b.id === id);
            const newOwnerId = data.ownerId === 'null' ? null : data.ownerId;
            const newRegionId = data.regionId === 'null' ? null : data.regionId;
            const batch = writeBatch(db);
            batch.update(doc(db, "businesses", id), { 
                name: data.name, sector: data.sector, ownerId: newOwnerId, regionId: newRegionId,
                balance: parseFloat(data.balance || 0),
                isPublicBody: !!data.isPublicBody,
                ...(data.sector === 'Educação' && { institutionType: data.institutionType }) 
            });
            if (oldBiz.ownerId !== newOwnerId) {
                if (oldBiz.ownerId) {
                    const oldOwner = state.residents.find(r => r.id === oldBiz.ownerId);
                    if (oldOwner) {
                        const newEmp = normalizeEmployment(oldOwner.employment).filter(j => !(j.businessId === id && j.position === 'Proprietário(a)'));
                        batch.update(doc(db, "residents", oldBiz.ownerId), { employment: newEmp });
                    }
                }
                if (newOwnerId) {
                    const newOwner = state.residents.find(r => r.id === newOwnerId);
                    if (newOwner) {
                        const newEmp = [...normalizeEmployment(newOwner.employment), { businessId: id, position: 'Proprietário(a)', salary: 0 }];
                        batch.update(doc(db, "residents", newOwnerId), { employment: newEmp });
                    }
                }
            }
            await batch.commit();
        }

        async function handleDeleteBusiness(id) {
            const batch = writeBatch(db); batch.delete(doc(db, "businesses", id));
            state.residents.forEach(r => {
                if (r.employment?.some(j => j.businessId === id)) batch.update(doc(db, "residents", r.id), { employment: r.employment.filter(j => j.businessId !== id) });
                if (r.education?.some(e => e.businessId === id)) batch.update(doc(db, "residents", r.id), { education: r.education.filter(e => e.businessId !== id) });
            });
            await batch.commit();
        }

        function generateReport(type) {
            let out = `### REGISTRO DETALHADO SIM - ${new Date().toLocaleString('pt-BR')}\n==========================\n\n`;
            if (type === 'residents') {
                const residentName = id => { const sim = state.residents.find(x => x.id === id); return sim ? `${sim.firstName} ${sim.lastName}` : 'Registro não encontrado'; };
                state.residents.filter(r => !r.isDeceased).forEach(r => {
                    const hasWallet = !['Bebê', 'Criança', 'Pré-adolescente'].includes(r.lifeStage);
                    out += `NOME: ${r.firstName} ${r.lastName}\nFASE: ${r.lifeStage || 'Não informada'}\nGÊNERO: ${r.gender || 'Não informado'}\nETNIA: ${r.ethnicity || 'Não informada'}\n`;
                    if (hasWallet) out += `SALDO: 🪙 ${Number(r.balance || 0).toLocaleString('pt-BR')} [${getSocialClass(Number(r.balance) || 0).label}]\n`;
                    out += `REGIÃO: ${state.regions.find(reg => reg.id === r.regionId)?.name || 'Não informada'}\n\nRELAÇÕES FAMILIARES E AFETIVAS:\n`;
                    out += r.relationships?.length ? r.relationships.map(rel => `- ${rel.type}: ${residentName(rel.residentId)}`).join('\n') + '\n' : '- Nenhuma relação cadastrada.\n';
                    out += `\nTRABALHO ATUAL:\n`;
                    out += r.employment?.length ? r.employment.map(job => { const biz = state.businesses.find(b => b.id === job.businessId); const branch = state.branches.find(b => b.id === job.branchId); return `- ${job.position || 'Cargo não informado'} em ${biz?.name || 'Empresa não encontrada'}${branch ? ` / ${branch.name}` : ''} (Salário por ciclo: 🪙 ${Number(job.salary || 0).toLocaleString('pt-BR')})`; }).join('\n') + '\n' : '- Nenhum emprego atual cadastrado.\n';
                    out += `\nHISTÓRICO PROFISSIONAL:\n`;
                    const pastJobs = (r.history || []).filter(entry => entry.type === 'job');
                    out += pastJobs.length ? pastJobs.map(entry => `- ${entry.status || 'Registro'}: ${entry.location || 'Local não informado'}${entry.position ? ` (${entry.position})` : ''}`).join('\n') + '\n' : '- Nenhum emprego anterior registrado.\n';
                    out += `\nFORMAÇÃO E ESTUDOS:\n`;
                    out += r.education?.length ? r.education.map(edu => `- ${edu.course}: ${edu.status} — ${state.businesses.find(b => b.id === edu.businessId)?.name || 'Instituição não encontrada'}`).join('\n') + '\n' : '- Nenhuma formação cadastrada.\n';
                    out += `--------------------------\n\n`;
                });
            } else if (type === 'businesses') {
                state.businesses.forEach(b => {
                    const owner = state.residents.find(r => r.id === b.ownerId);
                    out += `EMPRESA: ${b.name}\nRESPONSÁVEL: ${owner ? `${owner.firstName} ${owner.lastName}` : 'Em aberto / não cadastrado'}\nSALDO: 🪙 ${Number(b.balance || 0).toLocaleString('pt-BR')}\nSETOR: ${b.sector}\nTIPO: ${b.isPublicBody ? 'Órgão Público' : 'Privada'}\nREGIÃO: ${state.regions.find(r => r.id === b.regionId)?.name || 'Não informada'}\n--------------------------\n\n`;
                });
            } else if (type === 'politics') {
                out += `CENÁRIO POLÍTICO COMPLETO\n\n--- PODER EXECUTIVO ---\n`;
                const ministries = [...defaultMinistries, ...(state.government.ministries || [])];
                ministries.forEach(m => {
                    const holderId = state.government.roles?.[m.id];
                    const holder = state.residents.find(r => r.id === holderId);
                    const sal = state.government.salaries?.[m.id] || 0;
                    out += `${m.name}: ${holder ? `${holder.firstName} ${holder.lastName}` : 'CARGO VAGO'} (Salário do Tesouro: 🪙 ${sal.toLocaleString()})\n`;
                });
            } else if (type === 'obituary') {
                const dead = state.residents.filter(r => r.isDeceased).sort((a, b) => (a.deathDate?.seconds ?? Infinity) - (b.deathDate?.seconds ?? Infinity));
                dead.forEach(r => out += `+ ${r.firstName} ${r.lastName} [† ${r.deathDate?.seconds ? new Date(r.deathDate.seconds * 1000).toLocaleDateString('pt-BR') : 'Data não informada'}]\n`);
            } else if (type === 'finance-transparency') {
                out += `RELATÓRIO FINANCEIRO MASTER (DIÁRIO OFICIAL)\n\n--- COFRE PÚBLICO (TESOURO) ---\nSaldo Atual: 🪙 ${state.financeConfig.treasuryBalance?.toLocaleString() || 0}\n\n`;
                
                out += `--- TRIBUTAÇÃO VIGENTE ---\n`;
                out += `Impostos sobre Moradores:\n`;
                state.taxes.filter(t => t.category === 'resident').forEach(t => out += `- ${t.name}: ${t.rate}%\n`);
                out += `\nImpostos sobre Empresas:\n`;
                state.taxes.filter(t => t.category === 'business').forEach(t => out += `- ${t.name}: ${t.rate}%\n`);
                out += `\nImpostos Especiais (Seletivos):\n`;
                state.specialTaxes.forEach(st => out += `- ${st.name}: ${st.rate}% (Alvos: ${st.targetIds?.length || 0})\n`);
                
                out += `\n--- RANKING DE RIQUEZA (MORADORES) ---\n`;
                const topResidents = [...state.residents].filter(r => !r.isDeceased).sort((a,b) => (b.balance || 0) - (a.balance || 0)).slice(0, 10);
                topResidents.forEach((r, i) => out += `${i+1}. ${r.firstName} ${r.lastName}: 🪙 ${r.balance?.toLocaleString()}\n`);
                
                out += `\n--- RANKING DE RIQUEZA (EMPRESAS) ---\n`;
                const topBiz = [...state.businesses].sort((a,b) => (b.balance || 0) - (a.balance || 0)).slice(0, 10);
                topBiz.forEach((b, i) => out += `${i+1}. ${b.name}: 🪙 ${b.balance?.toLocaleString()}\n`);
                
                out += `\nESTATÍSTICAS GERAIS:\nTotal em Circulação: 🪙 ${state.financeConfig.totalCirculating.toLocaleString()}\n`;
            }
            document.getElementById('report-textarea').value = out; document.getElementById('report-output').classList.remove('hidden');
        }

        async function handleDeleteParty(id) {
            const party = state.parties.find(p => p.id === id);
            if (!party) return;
            const members = state.residents.filter(r => r.partyId === id);
            // Limite de operações por lote do Firestore: processa filiados em grupos menores.
            for (let offset = 0; offset < members.length; offset += 400) {
                const batch = writeBatch(db);
                members.slice(offset, offset + 400).forEach(r => batch.update(doc(db, "residents", r.id), { partyId: null }));
                await batch.commit();
            }
            await deleteDoc(doc(db, "parties", id));
        }

        async function handleEditParty(id, data) {
            const oldParty = state.parties.find(p => p.id === id);
            const newPresidentId = data.presidentId === 'null' ? null : data.presidentId;
            await updateDoc(doc(db, "parties", id), { name: data.name, spectrum: data.spectrum, presidentId: newPresidentId });
            if (oldParty.presidentId !== newPresidentId) {
                if (oldParty.presidentId) await updateDoc(doc(db, "residents", oldParty.presidentId), { partyId: null });
                if (newPresidentId) await updateDoc(doc(db, "residents", newPresidentId), { partyId: id });
            }
        }

        async function handleAppointMinister(officeId, officeName, newHolderId) {
            const batch = writeBatch(db);
            const currentHolderId = state.government.roles?.[officeId];
            newHolderId = newHolderId === 'null' ? null : newHolderId;
            if (currentHolderId && currentHolderId !== newHolderId) batch.update(doc(db, "residents", currentHolderId), { governmentRole: null });

        }

        function destroyCharts() { Object.values(state.charts).forEach(chart => chart.destroy()); state.charts = {}; }

            if (ctxAge) state.charts.age = new Chart(ctxAge, { type: 'bar', data: { labels: lifeStages, datasets: [{ label: 'Moradores', data: lifeStages.map(s => state.residents.filter(r => !r.isDeceased && r.lifeStage === s).length), backgroundColor: chartColors }] }, options: { scales: { y: { beginAtZero: true, ticks: { color: textColor }, grid: { color: gridColor } }, x: { ticks: { color: textColor }, grid: { color: gridColor } } }, plugins: { legend: { display: false } } } });

                state.charts.gender = new Chart(genderCtx, { type: 'pie', data: { labels: Object.keys(gCounts), datasets: [{ data: Object.values(gCounts), backgroundColor: chartColors }] }, options: { plugins: { legend: { labels: { color: textColor } } } } });

            if (ethnicityCtx) {

                state.charts.ethnicity = new Chart(ethnicityCtx, { type: 'pie', data: { labels: Object.keys(eCounts), datasets: [{ data: Object.values(eCounts), backgroundColor: chartColors }] }, options: { plugins: { legend: { labels: { color: textColor } } } } });

        document.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]'); if (!target) return;
            const { action, page, id, modalType, type, tab, relIndex, index, bizId } = target.dataset;

            switch (action) {
                case 'save-all-profits': saveAllProfits(); break;
                case 'delete-fine': deleteDoc(doc(db, "fines", id)); break;
                case 'cancel-subscription': deleteDoc(doc(db, "subscriptions", id)); break;
                case 'delete-plan': {
                    const bizRef = doc(db, "businesses", bizId);
                    const biz = state.businesses.find(b => b.id === bizId);
                    const plans = [...(biz.plans || [])];
                    plans.splice(parseInt(index), 1);
                    updateDoc(bizRef, { plans });
                } break;
                case 'delete-global-fixed-expense': {
                    const newList = [...state.fixedExpensesList];
                    newList.splice(parseInt(index), 1);
                    setDoc(doc(db, "config", "fixedExpenses"), { list: newList });
                } break;
                case 'extinguish-balance': updateDoc(doc(db, "residents", id), { balance: 0 }); break;
                case 'navigate': state.currentPage = page; state.searchQuery = ""; render(); break;
                case 'view-profile':
                    state.currentPage = `${type}-profile`;
                    if (type === 'resident') state.currentResidentId = id;
                    else if (type === 'business') { state.currentBusinessId = id; state.activeStudentTab = 'ativos'; }
                    else if (type === 'party') state.currentPartyId = id;
                    else if (type === 'council') state.currentCouncilId = id;
                    else if (type === 'region') state.currentRegionId = id;
                    else if (type === 'branch') state.currentBranchId = id;
                    state.searchQuery = ""; render(); break;
                case 'open-modal': renderModal(modalType, id, e); break;
                case 'close-modal': closeModal(); break;
                case 'delete-history-entry': handleDeleteHistoryEntry(target.dataset.residentId, target.dataset.historyId); break;
                case 'toggle-dark-mode':
                    document.documentElement.classList.toggle('dark');
                    localStorage.setItem('theme', document.documentElement.classList.contains('dark') ? 'dark' : 'light'); render(); break;
                case 'delete-relationship': {
                    const resident = state.residents.find(r => r.id === target.dataset.simAId);
                    const relation = resident?.relationships?.[Number(relIndex)];
                    if (!relation) break;
                    const relative = state.residents.find(r => r.id === relation.residentId);
                    const relativeName = relative ? `${relative.firstName} ${relative.lastName}` : 'este morador';
                    if (window.confirm(`Remover a relação ${relation.type} com ${relativeName}?`)) {
                        handleDeleteRelationship(resident.id, Number(relIndex)).catch(error => { console.error(error); alert('Não foi possível remover a relação.'); });
                    }
                } break;
                case 'delete-election-history': deleteDoc(doc(db, "electionHistory", id)); break;
                case 'delete-tax': deleteDoc(doc(db, "taxes", id)); break;
                case 'delete-special-tax': deleteDoc(doc(db, "specialTaxes", id)); break;
                case 'process-finance-cycle': processFinanceCycle(); break;
                case 'generate-election-report': generateElectionReport(); break;
                case 'add-sector-field': {
                    const div = document.createElement('div'); div.className = 'flex gap-2';
                    div.innerHTML = '<input type="text" name="sectorName" class="w-full p-2 border rounded-md" required><button type="button" data-action="remove-sector-field" class="text-red-500"><i data-lucide="x"></i></button>';
                    document.getElementById('sector-list').appendChild(div); lucide.createIcons();
                } break;
                case 'remove-sector-field': target.closest('.flex').remove(); break;
                case 'add-fixed-row': {
                    const div = document.createElement('div'); div.className = 'p-3 bg-[--bg-color] rounded-lg border border-[--border-color] space-y-2';
                    div.innerHTML = `
                        <div class="flex gap-2">
                            <input type="text" name="fixedName" class="w-full p-2 text-sm border rounded" placeholder="Nome do Gasto" required>
                            <button type="button" data-action="remove-fixed-row" class="text-red-500"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                        </div>
                        <div class="flex gap-2 items-center">
                            <select name="fixedType" class="w-1/2 p-2 text-sm border rounded bg-white">
                                <option value="fixed">Valor Fixo (🪙)</option>
                                <option value="percent">Percentual (%)</option>
                            </select>
                            <input type="number" name="fixedValue" class="w-1/2 p-2 text-sm border rounded" placeholder="Valor" step="0.01" required>
                        </div>`;
                    document.getElementById('fixed-list-container').appendChild(div); lucide.createIcons();
                } break;
                case 'remove-fixed-row': target.closest('.bg-[--bg-color]').remove(); break;
                case 'delete-fixed-expense-resident': {
                    const sim = state.residents.find(r => r.id === id);
                    let fixed = [...sim.fixedExpenses]; fixed.splice(parseInt(index), 1);
                    updateDoc(doc(db, "residents", id), { fixedExpenses: fixed });
                } break;
                case 'delete-fixed-expense-business': {
                    const biz = state.businesses.find(b => b.id === id);
                    let fixed = [...biz.fixedExpenses]; fixed.splice(parseInt(index), 1);
                    updateDoc(doc(db, "businesses", id), { fixedExpenses: fixed });
                } break;
                case 'end-election': setDoc(doc(db, "election", "current"), { isActive: false }); break;
                case 'remove-member': updateDoc(doc(db, "residents", target.dataset.residentId), { partyId: null }); break;
                case 'set-student-tab': state.activeStudentTab = tab; render(); break;
                case 'update-student-status': {
                    const residentId = target.dataset.residentId;
                    const idx = Number(target.dataset.eduIndex);
                    const resident = state.residents.find(r => r.id === residentId);
                    if (!resident || !Number.isInteger(idx) || !resident.education?.[idx]) break;
                    const previous = resident.education[idx];
                    const status = target.dataset.status;
                    if (!studentStatuses.includes(status)) break;
                    if (!window.confirm(`Alterar ${previous.course} para ${status}?`)) break;
                    const education = resident.education.map((edu, i) => i === idx ? { ...edu, status, ...(status === 'Formado(a)' ? { completedAt: new Date().toISOString() } : { completedAt: null }) } : edu);
                    updateDoc(doc(db, 'residents', residentId), { education }).catch(error => { console.error(error); alert('Não foi possível alterar a matrícula.'); });
                } break;
                case 'generate-report': generateReport(target.dataset.reportType); break;
                case 'copy-report':
                    const textarea = document.getElementById('report-textarea'); textarea.select(); document.execCommand('copy');
                    target.innerHTML = '<i data-lucide="check" class="h-5 w-5"></i> Copiado!';
                    setTimeout(() => { target.innerHTML = '<i data-lucide="copy" class="h-5 w-5"></i> Copiar Texto'; lucide.createIcons(); }, 2000); break;
                case 'add-ministry-field':
                    const list = document.getElementById('ministry-list');
                    const div = document.createElement('div'); div.className = 'flex items-center gap-2';
                    div.innerHTML = `<input type="text" name="ministryName" class="w-full px-3 py-2 border border-[--border-color] rounded-md bg-[--bg-color]" required><button type="button" data-action="remove-ministry-field" class="text-red-500 p-2 rounded-full hover:bg-[--danger-bg]"><i data-lucide="x"></i></button>`;
                    list.appendChild(div); lucide.createIcons(); break;
                case 'add-course-field': {
                    const row = document.createElement('div');
                    row.className = 'flex items-center gap-2';
                    row.innerHTML = '<input type="text" name="courseName" class="w-full px-3 py-2 border border-[--border-color] rounded-md bg-[--bg-color]" required><button type="button" data-action="remove-course-field" class="text-red-500 p-2 rounded-full" aria-label="Remover curso"><i data-lucide="x"></i></button>';
                    document.getElementById('course-list').appendChild(row);
                    lucide.createIcons();
                } break;
                case 'remove-course-field': target.closest('.flex').remove(); break;
                case 'remove-ministry-field': target.closest('.flex').remove(); break;
            }
        });

        document.addEventListener('submit', (e) => { e.preventDefault(); const form = e.target.closest('form'); if (form) handleFormSubmit(form); });
        document.addEventListener('input', (e) => { if (e.target.id === 'search-input') { state.searchQuery = e.target.value; updateListPage(); } });

        function checkAllDataLoaded() {
            const allLoaded = Object.values(state.dataLoaded).every(Boolean);
            if (allLoaded) {
                document.getElementById('loading-overlay').classList.add('opacity-0');
                setTimeout(() => { document.getElementById('loading-overlay').style.display = 'none' }, 500);
                if (!state.initialRenderDone) { render(); state.initialRenderDone = true; }
            }
        }

        function updateActiveNav() {
            const page = state.currentPage;
            const isDashboard = page === 'dashboard' || page === 'resident-profile';
            const isBusinesses = page === 'businesses' || page === 'business-profile' || page === 'branch-profile' || page === 'profit-central';
            const isMore = ['more', 'politics', 'party-profile', 'council-profile', 'register', 'settings', 'regions', 'region-profile', 'census-data', 'finance'].includes(page);
            document.querySelectorAll('.nav-button').forEach(btn => {
                const pageName = btn.dataset.page;
                let isActive = false;
                if (pageName === 'dashboard') isActive = isDashboard;
                else if (pageName === 'businesses') isActive = isBusinesses;
                else if (pageName === 'more') isActive = isMore;
                btn.classList.toggle('text-[--sims-green-dark]', isActive); btn.classList.toggle('text-[--text-secondary]', !isActive);
            });
        }

        const sortByCreated = (a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0);
        onSnapshot(collection(db, "residents"), (snapshot) => { state.residents = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated); state.dataLoaded.residents = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "businesses"), (snapshot) => { state.businesses = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated); state.dataLoaded.businesses = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "branches"), (snapshot) => { state.branches = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated); state.dataLoaded.branches = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "taxes"), (snapshot) => { state.taxes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated); state.dataLoaded.taxes = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "specialTaxes"), (snapshot) => { state.specialTaxes = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated); state.dataLoaded.specialTaxes = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(doc(db, "config", "fixedExpenses"), (doc) => { state.fixedExpensesList = doc.data()?.list || []; state.dataLoaded.fixedExpensesList = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(doc(db, "config", "finance"), (doc) => { state.financeConfig = doc.data() || { lastCycle: null, totalCirculating: 0, foodTax: 0, treasuryBalance: 0 }; state.dataLoaded.financeConfig = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "closedRecords"), (snapshot) => { state.closedRecords = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); state.dataLoaded.closedRecords = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "parties"), (snapshot) => { state.parties = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated); state.dataLoaded.parties = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "councils"), (snapshot) => { state.councils = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated); state.dataLoaded.councils = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "laws"), (snapshot) => { state.laws = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated); state.dataLoaded.laws = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "regions"), (snapshot) => { state.regions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort(sortByCreated); state.dataLoaded.regions = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "electionHistory"), (snapshot) => { state.electionHistory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); state.dataLoaded.electionHistory = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(doc(db, "config", "sectors"), (doc) => { state.customSectors = doc.data()?.list || []; state.dataLoaded.customSectors = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(doc(db, "government", "config"), (doc) => { state.government.ministries = doc.data()?.ministries || []; state.dataLoaded.governmentConfig = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(doc(db, "government", "roles"), (doc) => { state.government.roles = doc.data() || {}; state.dataLoaded.governmentRoles = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(doc(db, "government", "salaries"), (doc) => { state.government.salaries = doc.data() || {}; state.dataLoaded.governmentSalaries = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(doc(db, "election", "current"), (doc) => { state.election = doc.data() || { isActive: false }; state.dataLoaded.election = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "loans"), (snapshot) => { state.loans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); state.dataLoaded.loans = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "subscriptions"), (snapshot) => { state.subscriptions = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); state.dataLoaded.subscriptions = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        onSnapshot(collection(db, "fines"), (snapshot) => { state.fines = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a,b) => (b.date?.seconds || 0) - (a.date?.seconds || 0)); state.dataLoaded.fines = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });
        const qTreasury = query(collection(db, "treasuryHistory"), orderBy("date", "desc"), limit(7));
        onSnapshot(qTreasury, (snapshot) => { state.treasuryHistory = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })); state.dataLoaded.treasuryHistory = true; checkAllDataLoaded(); if (state.initialRenderDone) render(); });

        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
  </html>
