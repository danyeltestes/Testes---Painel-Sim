<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel SIM SIM.23.09#1</title>
    <!-- TailwindCSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #f4f8f5;
            --card-bg: #ffffff;
            --text-primary: #052e2e;
            --text-secondary: #6b7280;
            --border-color: #e5e7eb;
            --sims-green-dark: #1a4a4a;
            --sims-green-vibrant: #4ade80;
            --danger-bg: #fee2e2;
            --danger-text: #b91c1c;
            --finance-gold: #f59e0b;
        }

        html.dark {
            --bg-color: #062626;
            --card-bg: #0c3e3e;
            --text-primary: #e5e7eb;
            --text-secondary: #9ca3af;
            --border-color: #4a6e6e;
            --sims-green-dark: #a7f3d0;
            --sims-green-vibrant: #34d399;
            --danger-bg: #450a0a;
            --danger-text: #fca5a5;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            transition: background-color 0.3s, color 0.3s;
        }

        .nav-blur {
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            background-color: rgba(255, 255, 255, 0.7);
        }

        html.dark .nav-blur {
            background-color: rgba(6, 38, 38, 0.7);
        }

        .modal {
            transition: opacity 0.3s ease;
        }

        .modal-content {
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        .page-content {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        #report-textarea {
            white-space: pre-wrap;
        }

        .reason-radio-label {
            display: block;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            cursor: pointer;
            transition: all 0.2s;
        }

        .reason-radio-label:hover {
            border-color: var(--sims-green-vibrant);
        }

        input[type="radio"]:checked + .reason-radio-label {
            background-color: var(--sims-green-dark);
            color: white;
            border-color: var(--sims-green-dark);
        }

        .tab-btn.active {
            color: var(--sims-green-dark);
            border-bottom: 2px solid var(--sims-green-vibrant);
        }

        html.dark .tab-btn.active {
            color: var(--sims-green-vibrant);
        }

        .negative-balance {
            color: #ef4444;
        }

        .treasury-card {
            background: linear-gradient(135deg, #052e2e 0%, #1a4a4a 100%);
            color: white;
        }
        
        .profit-input:focus {
            border-color: var(--sims-green-vibrant);
            outline: none;
            box-shadow: 0 0 0 2px rgba(74, 222, 128, 0.2);
        }
    </style>
</head>
<body class="overscroll-none">
    <div id="loading-overlay" class="fixed inset-0 bg-[--bg-color] flex flex-col items-center justify-center z-50 transition-opacity duration-500">
        <svg class="animate-spin h-10 w-10 text-[--sims-green-vibrant]" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        <p class="mt-4 text-lg font-medium text-[--sims-green-dark]">Carregando Painel SIM...</p>
    </div>

    <main id="app-container" class="pb-24"></main>

    <div id="modal-container"></div>

    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 h-20 border-t border-[--border-color] nav-blur z-20">
        <div class="flex justify-around items-center h-full max-w-lg mx-auto">
            <button data-action="navigate" data-page="dashboard" class="nav-button flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="users" class="h-6 w-6 mb-1"></i>
                <span class="text-xs font-semibold">Moradores</span>
            </button>
            <button data-action="navigate" data-page="businesses" class="nav-button flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="building-2" class="h-6 w-6 mb-1"></i>
                <span class="text-xs font-semibold">Empresas</span>
            </button>
            <button data-action="navigate" data-page="more" class="nav-button flex flex-col items-center justify-center w-full h-full">
                <i data-lucide="menu" class="h-6 w-6 mb-1"></i>
                <span class="text-xs font-semibold">Mais</span>
            </button>
        </div>
    </nav>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, addDoc, updateDoc, deleteDoc, serverTimestamp, getDoc, writeBatch, setDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

        const firebaseConfig = { 
            apiKey: "AlzaSyBQnBNk6vMfei9faYKsZCChz868RVrkwCE",
            authDomain: "simer-7de4c.firebaseapp.com", 
            projectId: "simer-7de4c", 
            storageBucket: "simer-7de4c.appspot.com", 
            messagingSenderId: "1061418170591", 
            appId: "1:1061418170591:web:fa815bfbf696ace55c116a" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let state = {
            currentPage: 'dashboard',
            residents: [],
            businesses: [],
            branches: [],
            closedRecords: [],
            parties: [],
            councils: [],
            laws: [],
            regions: [],
            taxes: [],
            specialTaxes: [],
            fixedExpensesList: [],
            loans: [],
            subscriptions: [],
            treasuryHistory: [],
            fines: [],
            financeConfig: { 
                lastCycle: null, 
                totalCirculating: 0,
                costOfLiving: 0,
                foodTax: 0,
                treasuryBalance: 0,
                externalRevenueName: "Injeção do Estado",
                externalRevenueValue: 30000
            },
            electionHistory: [],
            customSectors: [],
            government: { roles: {}, ministries: [], salaries: {} },
            election: { isActive: false, candidates: [], votes: [], type: 'prefeito', ministryId: null, isTestMode: false, round: 1 },
            currentResidentId: null,
            currentBusinessId: null,
            currentPartyId: null,
            currentCouncilId: null,
            currentRegionId: null,
            currentBranchId: null,
            searchQuery: "",
            dataLoaded: { 
                residents: false, 
                businesses: false, 
                branches: false, 
                parties: false, 
                councils: false, 
                laws: false,
                regions: false, 
                taxes: false,
                specialTaxes: false,
                fixedExpensesList: false,
                financeConfig: false,
                governmentRoles: false, 
                governmentConfig: false, 
                governmentSalaries: false,
                election: false,
                electionHistory: false,
                customSectors: false,
                closedRecords: false,
                loans: false,
                treasuryHistory: false,
                subscriptions: false,
                fines: false
            },
            initialRenderDone: false,
            charts: {},
            activeStudentTab: 'ativos'
        };

        const currentVersion = 'SIM.23.09#1';
        const lifeStages = ['Bebê', 'Criança', 'Pré-adolescente', 'Adolescente', 'Adulto', 'Idoso'];
        const genders = ['Homem', 'Mulher', 'Homem Trans', 'Mulher Trans', 'Não-Binário'];
        const ethnicities = ['Asiático(a)', 'Branco(a)', 'Pardo(a)', 'Negro(a)'];
        const relationshipTypes = ['Cônjuge', 'Pai', 'Mãe', 'Filho(a)', 'Filho(a) Adotivo(a)', 'Afilhado(a)', 'Irmão(ã)', 'Tio(a)', 'Sobrinho(a)', 'Padrasto', 'Madrasta', 'Enteado(a)', 'Meio-irmão(ã)', 'Namorado(a)', 'Noivo(a)', 'Ex-Parceiro(a)', 'Avô(ó)', 'Neto(a)'];
        const defaultBusinessSectors = ['Varejo', 'Alimentação', 'Tecnologia', 'Saúde', 'Educação', 'Serviços', 'Entretenimento', 'Indústria', 'Governamental', 'Finanças', 'Esporte / Clube', 'Hotelaria', 'Banco'];
        const politicalSpectrums = ['Direita', 'Centro', 'Esquerda'];
        const defaultMinistries = [{ id: 'prefeito', name: 'Prefeito(a)', fixed: true }];
        const institutionTypes = ['Escola', 'Curso Técnico', 'Universidade', 'Instituto'];
        const studentStatuses = ['Cursando', 'Formado(a)', 'Expulso(a)', 'Trancado'];
        const jobRemovalReasons = ['Apenas remoção', 'Pediu demissão', 'Demitido(a)', 'Contrato concluído', 'Transferido(a)', 'Aposentado(a)'];
        const govRemovalReasons = ['Apenas remoção', 'Mandato Concluído', 'Impeachmado(a)', 'Aposentado(a)'];
        const councilRemovalReasons = ['Apenas remoção', 'Renunciou', 'Fim de Mandato', 'Expulso(a)'];
        const removalOptions = ['Se mudou', 'Morreu', 'Apenas remover'];
        const businessRemovalOptions = ['Apenas Remoção', 'Falência', 'Encerramento'];
        const lawRemovalReasons = ['Apenas Remoção', 'Revogada', 'Vetada', 'Expirada'];

        function getSocialClass(balance) {
            if (balance < 0) return { label: 'Devedor', color: 'bg-black' };
            if (balance < 1000) return { label: 'Miserável', color: 'bg-red-500' };
            if (balance < 10000) return { label: 'Pobre', color: 'bg-orange-500' };
            if (balance < 50000) return { label: 'Classe Média', color: 'bg-blue-500' };
            if (balance < 200000) return { label: 'Rico', color: 'bg-green-500' };
            return { label: 'Magnata', color: 'bg-yellow-500' };
        }

        function render() {
            destroyCharts();
            const appContainer = document.getElementById('app-container');
            const currentPageHTML = getPageHTML();
            if (appContainer.innerHTML !== currentPageHTML) {
                appContainer.innerHTML = currentPageHTML;
            }
            updateListPage();
            if (state.currentPage === 'census-data') {
                renderCharts();
            }
            updateActiveNav();
            lucide.createIcons();
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.value = state.searchQuery;
            }
        }

        function getPageHTML() {
            switch (state.currentPage) {
                case 'dashboard': return DashboardPage();
                case 'businesses': return BusinessesPage();
                case 'more': return MorePage();
                case 'politics': return PoliticsPage();
                case 'register': return RegisterPage();
                case 'settings': return SettingsPage();
                case 'regions': return RegionsPage();
                case 'finance': return FinancePage();
                case 'census-data': return CensusDataPage();
                case 'resident-profile': return ResidentProfilePage();
                case 'business-profile': return BusinessProfilePage();
                case 'branch-profile': return BranchProfilePage();
                case 'party-profile': return PartyProfilePage();
                case 'council-profile': return CouncilProfilePage();
                case 'region-profile': return RegionProfilePage();
                case 'profit-central': return ProfitCentralPage();
                default: return ErrorPage('Página não encontrada', 'dashboard');
            }
        }

        function updateListPage() {
            if (['dashboard', 'businesses', 'regions', 'politics'].includes(state.currentPage)) {
                const listContainer = document.getElementById('list-container');
                if (listContainer) {
                    let content = "";
                    if (state.currentPage === 'dashboard') {
                        const filteredResidents = state.residents.filter(r => !r.isDeceased && `${r.firstName} ${r.lastName}`.toLowerCase().includes(state.searchQuery.toLowerCase()));
                        content = filteredResidents.length > 0 ? filteredResidents.map(sim => ResidentCard(sim)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhum cidadão encontrado.</p>`;
                    } else if (state.currentPage === 'businesses') {
                        const filteredBusinesses = state.businesses.filter(b => b.name.toLowerCase().includes(state.searchQuery.toLowerCase()));
                        content = filteredBusinesses.length > 0 ? filteredBusinesses.map(biz => BusinessCard(biz)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhuma empresa encontrada.</p>`;
                    } else if (state.currentPage === 'regions') {
                        const filteredRegions = state.regions.filter(r => r.name.toLowerCase().includes(state.searchQuery.toLowerCase()));
                        content = filteredRegions.length > 0 ? filteredRegions.map(reg => RegionCard(reg)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhuma região encontrada.</p>`;
                    }
                    listContainer.innerHTML = content;
                }

                if (state.currentPage === 'politics') {
                    const partiesContainer = document.getElementById('parties-list-container');
                    if (partiesContainer) {
                        const filteredParties = state.parties.filter(p => p.name.toLowerCase().includes(state.searchQuery.toLowerCase()));
                        const partyContent = filteredParties.length > 0 ? filteredParties.map(party => PartyCard(party)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhum partido encontrado.</p>`;
                        partiesContainer.innerHTML = partyContent;
                    }
                    const councilsContainer = document.getElementById('councils-list-container');
                    if (councilsContainer) {
                        const councilContent = state.councils.length > 0 ? state.councils.map(council => CouncilCard(council)).join("") : `<p class="text-[--text-secondary] col-span-full text-center py-8">Nenhum conselho criado.</p>`;
                        councilsContainer.innerHTML = councilContent;
                    }
                }
            }
            lucide.createIcons();
        }

        const ResidentCard = (sim) => {
            let statusIcons = "";
            if (sim.employment && sim.employment.length > 0) statusIcons += '<i data-lucide="briefcase" class="inline-block h-4 w-4 mr-1 text-blue-500"></i>';
            if (sim.governmentRole || (sim.councilRoles && sim.councilRoles.length > 0)) statusIcons += '<i data-lucide="landmark" class="inline-block h-4 w-4 mr-1 text-purple-500"></i>';
            if (sim.education && sim.education.some(e => e.status === 'Cursando')) statusIcons += '<i data-lucide="graduation-cap" class="inline-block h-4 w-4 mr-1 text-green-500"></i>';
            const deceasedTag = sim.isDeceased ? ' <span class="text-[10px] font-extrabold bg-gray-200 text-gray-600 px-1 rounded ml-1">FALECIDO(A)</span>' : "";
            
            const hasWallet = !['Bebê', 'Criança', 'Pré-adolescente'].includes(sim.lifeStage);
            const bal = sim.balance || 0;
            const balanceStr = (hasWallet && sim.balance !== undefined) ? ` | <span class="${bal < 0 ? 'negative-balance font-bold' : ''}">🪙 ${bal.toLocaleString()}</span>` : "";
            
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="resident" data-id="${sim.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${statusIcons}${sim.firstName} ${sim.lastName}${deceasedTag}</h4>
                <p class="text-sm text-[--text-secondary]">${sim.lifeStage || 'Fase da vida não definida'}${balanceStr}</p>
            </div>`;
        };

        const BusinessCard = (biz) => {
            const employeeCount = state.residents.filter(r => !r.isDeceased && r.employment?.some(job => job.businessId === biz.id)).length;
            let subtext = biz.sector;
            if (biz.sector === 'Educação') subtext = biz.institutionType || 'Educação';
            if (biz.sector === 'Banco') subtext = '🏦 Instituição Financeira';
            if (biz.isPublicBody || biz.sector === 'Governamental') subtext = '🏛 Órgão Público';
            const bal = biz.balance || 0;
            const balanceStr = biz.balance !== undefined ? ` | <span class="${bal < 0 ? 'negative-balance font-bold' : ''}">🪙 ${bal.toLocaleString()}</span>` : "";
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="business" data-id="${biz.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${biz.name}</h4>
                <p class="text-sm text-[--text-secondary]">${subtext}${balanceStr}</p>
                <p class="text-xs text-[--text-secondary] mt-2 pt-2 border-t border-[--border-color]">Funcionários: ${employeeCount}</p>
            </div>`;
        };

        const BranchCard = (branch) => {
            const sede = state.businesses.find(b => b.id === branch.parentBusinessId);
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="branch" data-id="${branch.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${branch.name}</h4>
                <p class="text-xs uppercase font-bold text-[--text-secondary]">Unidade de ${sede?.name || 'Sede'}</p>
            </div>`;
        };

        const PartyCard = (party) => {
            const president = state.residents.find(r => r.id === party.presidentId);
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="party" data-id="${party.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${party.name}</h4>
                <p class="text-sm text-[--text-secondary]">${party.spectrum}</p>
                <p class="text-xs text-[--text-secondary] mt-2 pt-2 border-t border-[--border-color]">Presidente: ${president ? `${president.firstName} ${president.lastName}` : 'Indefinido'}</p>
            </div>`;
        };

        const CouncilCard = (council) => {
            const president = state.residents.find(r => r.id === council.presidentId);
            const councilorCount = council.councilorIds?.length || 0;
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="council" data-id="${council.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${council.name}</h4>
                <p class="text-sm text-[--text-secondary]">Presidente: ${president ? `${president.firstName} ${president.lastName}` : 'Indefinido'}</p>
                <p class="text-xs text-[--text-secondary] mt-2 pt-2 border-t border-[--border-color]">Conselheiros: ${councilorCount}</p>
            </div>`;
        };

        const RegionCard = (region) => {
            const residentCount = state.residents.filter(r => !r.isDeceased && r.regionId === region.id).length;
            const businessCount = state.businesses.filter(b => b.regionId === region.id).length;
            return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] cursor-pointer hover:shadow-lg hover:-translate-y-1 transition-all" data-action="view-profile" data-type="region" data-id="${region.id}">
                <h4 class="font-bold text-lg text-[--sims-green-dark]">${region.name}</h4>
                <div class="text-sm text-[--text-secondary] mt-2 pt-2 border-t border-[--border-color] grid grid-cols-2 gap-2">
                    <span><i data-lucide="users" class="inline-block h-4 w-4 mr-1"></i> ${residentCount}</span>
                    <span><i data-lucide="building-2" class="inline-block h-4 w-4 mr-1"></i> ${businessCount}</span>
                </div>
            </div>`;
        };

        function DashboardPage() {
            const activeResidents = state.residents.filter(r => !r.isDeceased);
            return `<div class="page-content p-4 md:p-6">
                <header class="mb-6">${HeaderComponent('Painel SIM', 'O painel de controle da sua cidade.', currentVersion)}</header>
                <div class="grid grid-cols-2 gap-4 mb-6">
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-3xl text-[--sims-green-dark]">${activeResidents.length}</h3><p class="text-sm text-[--text-secondary]">Moradores Ativos</p></div>
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-3xl text-[--sims-green-dark]">${state.businesses.length}</h3><p class="text-sm text-[--text-secondary]">Empresas</p></div>
                </div>
                <div>
                    <h2 class="text-2xl font-semibold text-[--sims-green-dark] mb-4">Cidadãos</h2>
                    ${SearchComponent('morador')}
                    <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
                </div>
            </div>
            ${FABComponent('add-resident')}`;
        }

        function BusinessesPage() {
            return `<div class="page-content p-4 md:p-6">
                <header class="mb-6">${HeaderComponent('Empresas e Comércio', 'Gerencie a economia da sua cidade.', currentVersion)}</header>
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 mb-4">
                    <h2 class="text-2xl font-semibold text-[--sims-green-dark]">Estabelecimentos</h2>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <button data-action="navigate" data-page="profit-central" class="flex-1 sm:flex-none text-sm bg-[--finance-gold] text-white px-4 py-2 rounded-lg font-bold flex items-center justify-center gap-2 shadow-sm hover:bg-yellow-600 transition"><i data-lucide="dollar-sign"></i> Central de Lucros</button>
                        <button data-action="open-modal" data-modal-type="manage-sectors" class="flex-1 sm:flex-none text-sm bg-[--border-color] px-3 py-2 rounded-lg font-medium hover:bg-gray-200 transition">Setores</button>
                    </div>
                </div>
                ${SearchComponent('empresa')}
                <div id="list-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
            </div>
            ${FABComponent('add-business')}`;
        }

        function ProfitCentralPage() {
            const bizList = state.businesses.map(biz => `
                <div class="flex items-center justify-between p-4 bg-[--card-bg] border border-[--border-color] rounded-xl shadow-sm mb-3">
                    <div class="flex-1">
                        <p class="font-bold text-[--sims-green-dark] text-lg">${biz.name}</p>
                        <p class="text-xs text-[--text-secondary] uppercase font-bold tracking-tight">${biz.sector} | Atual: 🪙 ${biz.balance?.toLocaleString()}</p>
                    </div>
                    <div class="w-32">
                        <input type="number" 
                               data-biz-id="${biz.id}" 
                               class="profit-input w-full p-2 border border-[--border-color] rounded-lg text-right font-mono font-bold bg-[--bg-color]" 
                               placeholder="🪙 0" 
                               step="1">
                    </div>
                </div>
            `).join("");

            return `<div class="page-content p-4 md:p-6 space-y-6">
                <header>
                    <button data-action="navigate" data-page="businesses" class="flex items-center text-sm text-[--sims-green-dark] font-semibold mb-4 hover:underline">

                    <button data-action="navigate" data-page="census-data" class="bg-[--card-bg] p-6 rounded-lg shadow-sm border border-[--border-color] flex flex-col items-center justify-center aspect-square hover:shadow-lg hover:-translate-y-1 transition-all"><i data-lucide="pie-chart" class="h-10 w-10 mb-2 text-[--sims-green-vibrant]"></i><span class="font-semibold text-center">Censo</span></button>
                </div>
            </div>`;
        }

        function FinancePage() {
            const lastCycleDate = state.financeConfig.lastCycle ? new Date(state.financeConfig.lastCycle.seconds * 1000).toLocaleString('pt-BR') : 'Nunca processado';
            
            const taxesResident = state.taxes.filter(t => t.category === 'resident');
            const taxesBusiness = state.taxes.filter(t => t.category === 'business');

            const taxListHTML = (taxes) => taxes.length > 0 ? taxes.map(t => `
                <div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color] mb-2">
                    <div>
                        <p class="font-semibold">${t.name}</p>
                        <p class="text-xs text-[--text-secondary]">${t.rate}%</p>
                    </div>
                    <div class="flex gap-1">
                        <button data-action="open-modal" data-modal-type="edit-tax" data-id="${t.id}" class="text-blue-500 p-1"><i data-lucide="edit-3" class="h-4 w-4"></i></button>
                        <button data-action="delete-tax" data-id="${t.id}" class="text-red-500 p-1"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                    </div>
                </div>
            `).join("") : '<p class="text-xs italic text-[--text-secondary] text-center py-2">Nenhum imposto definido.</p>';

            const specialTaxesHTML = state.specialTaxes.map(st => {
                return `
                <div class="p-3 bg-[--card-bg] rounded-md flex justify-between items-center border border-[--border-color] mb-2 shadow-sm">
                    <div>
                        <p class="font-bold text-[--sims-green-dark]">${st.name} <span class="text-[--finance-gold] ml-1 font-black">${st.rate}%</span></p>
                        <p class="text-[10px] text-[--text-secondary] uppercase font-bold">Contribuintes: ${st.targetIds?.length || 0}</p>
                    </div>
                    <div class="flex gap-1">
                        <button data-action="open-modal" data-modal-type="edit-special-tax" data-id="${st.id}" class="text-blue-500 p-1"><i data-lucide="edit-3" class="h-4 w-4"></i></button>
                        <button data-action="delete-special-tax" data-id="${st.id}" class="text-red-500 p-1"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                    </div>
                </div>`;
            }).join("");

            const historyHTML = state.treasuryHistory.map(cycle => `
                <div class="p-3 bg-[--bg-color] border border-[--border-color] rounded-lg mb-2 flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold">Ciclo: ${new Date(cycle.date?.seconds * 1000).toLocaleDateString()}</p>
                        <p class="text-[--finance-gold]">Arrecadação Total: 🪙 ${cycle.totalCollected?.toLocaleString()}</p>
                    </div>
                    <div class="text-right">
                        <p class="font-bold">Tesouro Final</p>
                        <p class="font-mono ${cycle.balance < 0 ? 'text-red-500' : 'text-green-500'}">🪙 ${cycle.balance?.toLocaleString()}</p>
                    </div>
                </div>
            `).join("");

            const deceasedWithBalance = state.residents.filter(r => r.isDeceased && (r.balance || 0) > 0);
            const inheritanceHTML = deceasedWithBalance.map(r => `
                <div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color] mb-2">
                    <div>
                        <p class="font-bold">${r.firstName} ${r.lastName}</p>
                        <p class="text-xs text-[--danger-text]">Saldo Pendente: 🪙 ${r.balance.toLocaleString()}</p>
                    </div>
                    <div class="flex gap-2">
                        <button data-action="open-modal" data-modal-type="transfer-inheritance" data-id="${r.id}" class="bg-[--sims-green-dark] text-white text-[10px] px-2 py-1 rounded font-bold">Transferir</button>
                        <button data-action="extinguish-balance" data-id="${r.id}" class="bg-gray-500 text-white text-[10px] px-2 py-1 rounded font-bold">Extinguir</button>
                    </div>
                </div>
            `).join("");

            return `<div class="page-content p-4 md:p-6 space-y-8">
                <header>${HeaderComponent('Banco Central', 'Controle financeiro e tributário.', currentVersion)}</header>
                
                <section class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="treasury-card p-6 rounded-xl shadow-lg border border-[--border-color] flex flex-col items-center justify-center text-center">
                        <p class="text-sm font-bold text-gray-300 uppercase tracking-wider mb-2">Cofre Público (Tesouro)</p>
                        <h2 class="text-4xl font-extrabold ${state.financeConfig.treasuryBalance < 0 ? 'text-red-400' : 'text-[--sims-green-vibrant]'}">🪙 ${state.financeConfig.treasuryBalance?.toLocaleString() || 0}</h2>
                        <div class="flex gap-3 mt-4">
                             <button data-action="open-modal" data-modal-type="inject-treasury" class="bg-white/10 hover:bg-white/20 text-white text-[10px] px-3 py-1 rounded-full border border-white/20 font-bold uppercase tracking-tighter">Injetar Manual</button>
                             <button data-action="open-modal" data-modal-type="spend-treasury" class="bg-white/10 hover:bg-white/20 text-white text-[10px] px-3 py-1 rounded-full border border-white/20 font-bold uppercase tracking-tighter">Gasto Público</button>
                        </div>
                    </div>
                    <div class="bg-[--card-bg] p-6 rounded-xl shadow-sm border border-[--border-color]">
                        <p class="text-sm font-bold text-[--text-secondary] uppercase tracking-wider mb-4">Ciclo Econômico</p>
                        <div class="space-y-4">
                            <div>
                                <p class="text-xs text-[--text-secondary]">Última Virada:</p>
                                <p class="font-mono text-sm">${lastCycleDate}</p>
                            </div>
                            <button data-action="process-finance-cycle" class="w-full bg-[--sims-green-dark] text-white py-3 rounded-lg font-bold hover:bg-opacity-90 transition flex items-center justify-center gap-2">
                                <i data-lucide="refresh-cw" class="h-5 w-5"></i> Processar Ciclo Financeiro
                            </button>
                        </div>
                    </div>
                </section>

                <section class="bg-[--card-bg] p-6 rounded-xl shadow-sm border border-[--border-color]">
                    <h2 class="text-xl font-bold text-[--sims-green-dark] mb-4 flex items-center gap-2"><i data-lucide="landmark"></i> Arrecadação e Tesouro</h2>
                    <form id="global-finance-form" data-action="save-global-finance" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${createFormInput('externalRevenueName', 'Nome da Injeção Automática', state.financeConfig.externalRevenueName || "Injeção do Estado")}
                        ${createFormInput('externalRevenueValue', 'Valor Automático por Ciclo (🪙)', state.financeConfig.externalRevenueValue || 0, 'number')}
                        ${createFormInput('costOfLiving', 'Custo de Vida Global (%)', state.financeConfig.costOfLiving || 0, 'number')}
                        ${createFormInput('foodTax', 'Taxa de Alimentação (%)', state.financeConfig.foodTax || 0, 'number')}
                        <button type="submit" class="md:col-span-2 bg-[--sims-green-vibrant] text-[--sims-green-dark] font-bold py-2 rounded-lg">Salvar Configurações de Gestão</button>
                    </form>
                </section>

                <section class="bg-[--card-bg] p-6 rounded-xl shadow-sm border border-[--border-color]">
                    <h2 class="text-xl font-bold text-[--sims-green-dark] mb-4 flex items-center gap-2"><i data-lucide="bar-chart-3"></i> Transparência Fiscal (Últimos 7 Ciclos)</h2>
                    <div class="space-y-2">
                        ${historyHTML || '<p class="text-center italic text-xs py-4 text-gray-400">Nenhum histórico disponível ainda.</p>'}
                    </div>
                </section>

                <section class="space-y-6">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-semibold text-[--sims-green-dark]">Gestão de Impostos</h2>
                        <button data-action="open-modal" data-modal-type="add-tax" class="bg-[--finance-gold] text-white px-4 py-2 rounded-lg font-bold text-sm">+ Novo Imposto</button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div>
                            <h3 class="font-bold text-sm text-[--text-secondary] uppercase mb-3 flex items-center gap-2">
                                <i data-lucide="user" class="h-4 w-4"></i> Impostos sobre Moradores
                            </h3>
                            ${taxListHTML(taxesResident)}
                        </div>
                        <div>
                            <h3 class="font-bold text-sm text-[--text-secondary] uppercase mb-3 flex items-center gap-2">
                                <i data-lucide="building-2" class="h-4 w-4"></i> Impostos sobre Empresas
                            </h3>
                            ${taxListHTML(taxesBusiness)}
                        </div>
                    </div>
                </section>

                <section class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h2 class="text-2xl font-semibold text-[--sims-green-dark]">Impostos Especiais</h2>
                        <button data-action="open-modal" data-modal-type="add-special-tax" class="bg-[--danger-text] text-white px-4 py-2 rounded-lg font-bold text-sm">+ Criar Imposto Especial</button>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${specialTaxesHTML || '<p class="text-sm italic text-[--text-secondary] py-4 col-span-full text-center">Nenhum imposto especial registrado.</p>'}
                    </div>
                </section>

                <section class="space-y-4">
                    <h2 class="text-2xl font-semibold text-[--sims-green-dark]">Sucessão e Herança</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        ${inheritanceHTML || '<p class="text-sm italic text-[--text-secondary] py-4 col-span-full text-center">Nenhum espólio pendente para partilha.</p>'}
                    </div>
                </section>
            </div>`;
        }

        function PoliticsPage() {
            const ministries = [...defaultMinistries, ...(state.government.ministries || [])];
            
            const salaryHTML = ministries.map(min => {
                const salValue = state.government.salaries?.[min.id] || 0;
                return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color] mb-2">
                    <div><p class="font-semibold text-sm">${min.name}</p></div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-[--finance-gold]">🪙 ${salValue.toLocaleString()}</span>
                        <button data-action="open-modal" data-modal-type="edit-gov-salary" data-office-id="${min.id}" data-office-name="${min.name}" class="text-blue-500 p-1"><i data-lucide="edit-3" class="h-4 w-4"></i></button>
                    </div>
                </div>`;
            }).join("");

            const governmentHTML = ministries.map(min => {
                const holder = state.residents.find(r => r.id === state.government.roles?.[min.id]);
                const buttonHTML = holder ? `<button data-action="open-modal" data-modal-type="remove-minister-reason" data-office-id="${min.id}" data-office-name="${min.name}" data-resident-id="${holder.id}" class="text-sm bg-[--danger-bg] text-[--danger-text] px-3 py-1 rounded-md hover:bg-opacity-80 transition">Remover</button>` : `<button data-action="open-modal" data-modal-type="appoint-minister" data-office-id="${min.id}" data-office-name="${min.name}" class="text-sm bg-[--border-color] text-[--text-primary] px-3 py-1 rounded-md hover:bg-opacity-80 transition">Nomear</button>`;
                return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]">
                    <div><p class="font-semibold">${min.name}</p><p class="text-sm ${holder ? 'text-[--text-secondary]' : 'text-gray-400 italic'}">${holder ? `${holder.firstName} ${holder.lastName}` : 'Cargo Vago'}</p></div>
                    ${buttonHTML}
                </div>`;
            }).join("");

            let electionHTML = "";
            if (state.election.isActive) {
                const candidatesHTML = (state.election.candidates || []).map(cand => {
                    const sim = state.residents.find(r => r.id === cand.id);
                    const party = state.parties.find(p => p.id === sim?.partyId);
                    return `<div class="p-3 bg-[--bg-color] rounded-md border border-[--border-color] flex justify-between items-center">
                        <div>
                            <p class="font-semibold">${sim ? `${sim.firstName} ${sim.lastName}` : 'Candidato desconhecido'}</p>
                            <p class="text-[10px] text-[--text-secondary] uppercase font-bold">${party ? party.name : 'Sem Partido'}</p>
                        </div>
                    </div>`;
                }).join("");

                const typeText = state.election.type === 'prefeito' ? 'Prefeito(a)' : `Ministro(a) (${state.election.ministryName})`;
                const testTag = state.election.isTestMode ? '<span class="ml-2 text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full uppercase font-bold">Modo Teste</span>' : '';
                const roundText = state.election.round === 2 ? '<span class="ml-2 text-[10px] bg-yellow-100 text-yellow-700 px-2 py-0.5 rounded-full uppercase font-bold">2º Turno</span>' : '<span class="ml-2 text-[10px] bg-gray-100 text-gray-700 px-2 py-0.5 rounded-full uppercase font-bold">1º Turno</span>';
                const totalVotes = state.election.votes?.length || 0;

                electionHTML = `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]">
                    <div class="flex justify-between items-center mb-4">
                        <div>
                            <h3 class="font-bold text-lg">Eleição Ativa: ${typeText}${testTag}${roundText}</h3>
                            <p class="text-xs text-[--text-secondary]">Total de Votos: ${totalVotes}</p>
                        </div>
                        <button data-action="end-election" class="text-xs bg-[--danger-bg] text-[--danger-text] px-2 py-1 rounded-md hover:bg-opacity-80">Cancelar</button>
                    </div>
                    
                    <div class="space-y-2 mb-4">${candidatesHTML || '<p class="text-sm italic text-center py-2">Sem candidatos.</p>'}</div>
                    
                    <div class="grid grid-cols-1 gap-2 mb-4">
                        ${state.election.round === 1 ? `<button data-action="open-modal" data-modal-type="add-candidate" class="w-full text-sm bg-[--border-color] text-[--text-primary] py-2 rounded-lg font-semibold">Adicionar Candidato</button>` : ''}
                        <button data-action="open-modal" data-modal-type="register-vote" class="w-full text-sm bg-[--sims-green-vibrant] text-white py-2 rounded-lg font-semibold">Registrar Voto</button>
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button data-action="generate-election-report" class="w-full text-xs bg-gray-200 py-2 rounded-lg font-bold">Ver Parcial</button>
                        ${state.election.round === 1 ? 
                            `<button data-action="open-modal" data-modal-type="setup-second-round" class="w-full text-sm bg-yellow-500 text-white py-2 rounded-lg font-semibold hover:bg-yellow-600">Ir para 2º Turno</button>` : ''
                        }
                    </div>
                    <button data-action="open-modal" data-modal-type="declare-winner" class="w-full mt-2 text-sm bg-[--sims-green-dark] text-white py-2 rounded-lg font-semibold">Declarar Vencedor</button>
                </div>`;
            } else {
                electionHTML = `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color] flex justify-between items-center"><p>Nenhuma eleição ativa.</p><button data-action="open-modal" data-modal-type="start-election-setup" class="bg-[--sims-green-vibrant] text-white px-4 py-2 rounded-lg font-semibold">Iniciar Nova Eleição</button></div>`;
            }

            const historyHTML = state.electionHistory.map(hist => {
                const winner = state.residents.find(r => r.id === hist.winnerId);
                const typeLabel = hist.type === 'prefeito' ? 'Prefeito(a)' : `Ministro(a) (${hist.ministryName})`;
                const roundLabel = hist.round === 2 ? '(2º Turno)' : '(1º Turno)';
                return `<div class="p-3 bg-[--card-bg] border border-[--border-color] rounded-lg mb-2 flex justify-between items-center">
                    <div>
                        <p class="font-bold text-sm">${typeLabel} ${roundLabel}</p>
                        <p class="text-xs">Vencedor: ${winner ? `${winner.firstName} ${winner.lastName}` : 'Desconhecido'} (${hist.winnerVotes} votos)</p>
                        <p class="text-[10px] text-[--text-secondary]">${new Date(hist.date?.seconds * 1000).toLocaleString('pt-BR')}</p>
                    </div>
                    <button data-action="delete-election-history" data-id="${hist.id}" class="text-red-500 p-2"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                </div>`;
            }).reverse().join("");

            const lawsHTML = (state.laws || []).map(law => {
                const decretou = state.residents.find(r => r.id === law.proclaimedById);
                return `<div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]">
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-lg text-[--sims-green-dark]">${law.title}</h4>
                            <p class="text-sm text-[--text-secondary]">${law.description}</p>
                        </div>
                        <button data-action="open-modal" data-modal-type="remove-law" data-id="${law.id}" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="h-4 w-4"></i></button>
                    </div>
                    <div class="mt-2 pt-2 border-t border-[--border-color] text-xs text-[--text-secondary]">
                        <p><strong>Autores:</strong> ${(law.authorIds || []).map(id => {
                            const a = state.residents.find(r => r.id === id);
                            return a ? `${a.firstName} ${a.lastName}` : 'Desconhecido';
                        }).join(", ")}</p>
                        <p class="mt-1"><strong>Decretado por:</strong> ${decretou ? `${decretou.firstName} ${decretou.lastName}` : 'Ninguém'}</p>
                    </div>
                </div>`;
            }).join("");

            const finesHTML = state.fines.map(fine => {
                const targetSim = state.residents.find(r => r.id === fine.targetId);
                const targetBiz = state.businesses.find(b => b.id === fine.targetId);
                const targetName = targetSim ? `${targetSim.firstName} ${targetSim.lastName}` : (targetBiz ? targetBiz.name : 'Desconhecido');
                const isPublic = fine.isPublic || targetBiz?.isPublicBody;
                return `
                <div class="p-3 bg-[--bg-color] border border-[--border-color] rounded-lg mb-2 flex justify-between items-center text-xs">
                    <div>
                        <p class="font-bold text-[--danger-text] uppercase tracking-tighter">Infrator: ${targetName} ${isPublic ? '[PÚBLICO]' : ''}</p>
                        <p class="font-medium">Motivo: ${fine.reason}</p>
                        <p class="text-gray-400">${new Date(fine.date?.seconds * 1000).toLocaleString()}</p>
                    </div>
                    <div class="text-right flex flex-col items-end">
                        <p class="font-black text-red-500">🪙 - ${fine.amount.toLocaleString()}</p>
                        <button data-action="delete-fine" data-id="${fine.id}" class="mt-2 text-gray-400 hover:text-red-500"><i data-lucide="trash-2" class="h-3 w-3"></i></button>
                    </div>
                </div>`;
            }).join("");

            return `<div class="page-content p-4 md:p-6 space-y-8">
                <header>${HeaderComponent('Cenário Político', 'Gerencie o governo e os partidos.', currentVersion)}</header>
                
                <section>
                    <div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-semibold text-[--sims-green-dark]">Poder Executivo</h2><button data-action="open-modal" data-modal-type="manage-ministries" class="text-sm bg-[--border-color] text-[--text-primary] px-3 py-1 rounded-md hover:bg-opacity-80 transition">Gerenciar</button></div>
                    <div class="space-y-2">${governmentHTML}</div>
                </section>

                <section class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]">
                    <h2 class="text-xl font-bold text-[--sims-green-dark] mb-4 flex items-center gap-2"><i data-lucide="banknote"></i> Salários do Executivo</h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-2">

                <header>${HeaderComponent('Dados de Censo', 'Análise demográfica e econômica da cidade.', currentVersion)}</header>
                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-lg mb-2">Classes sociais dos moradores</h3><p class="text-xs text-[--text-secondary] mb-2">Classificação baseada no saldo atual dos moradores vivos.</p><canvas id="social-class-chart"></canvas></div>
                    <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-lg mb-2">Empresas por Setor</h3><canvas id="business-sector-chart"></canvas></div>
                </div>

        function SettingsPage() {
            const totalResidents = state.residents.length;
            const totalBusinesses = state.businesses.length;
            const totalRecords = totalResidents + totalBusinesses + state.branches.length + state.parties.length + state.councils.length + state.regions.length;
            const recordLimit = 50000;
            const usagePercentage = Math.min((totalRecords / recordLimit) * 100, 100);
            const residentListHTML = state.residents.map(r => `<div class="flex justify-between items-center p-2 hover:bg-[--border-color] rounded-md"><span>${r.firstName} ${r.lastName} ${r.isDeceased ? '(†)' : ''}</span><button data-action="open-modal" data-modal-type="confirm-removal" data-id="${r.id}" class="text-red-500 hover:text-red-700 p-1"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div>`).join("");
            
            return `<div class="page-content p-4 md:p-6 space-y-8">
                <header><button data-action="navigate" data-page="more" class="flex items-center text-sm text-[--sims-green-dark] font-semibold mb-4 hover:underline"><i data-lucide="arrow-left" class="h-4 w-4 mr-2"></i> Voltar para Mais</button>${HeaderComponent('Configurações', 'Gerencie seu aplicativo e dados.', currentVersion)}</header>
                
                <section class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><h3 class="font-bold text-lg mb-2">Uso de Dados</h3><div class="w-full bg-[--border-color] rounded-full h-2.5 mb-2"><div class="bg-[--sims-green-vibrant] h-2.5 rounded-full" style="width: ${usagePercentage}%"></div></div><p class="text-right text-sm font-medium text-[--text-secondary]">${totalRecords} Registros</p></section>
                
                <section class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]"><div class="flex justify-between items-center mb-4"><h3 class="font-bold text-lg">Gastos Fixos Padrão</h3><button data-action="open-modal" data-modal-type="manage-fixed-expenses-list" class="bg-[--sims-green-dark] text-white text-xs px-3 py-1 rounded-md">Configurar Lista</button></div><div class="space-y-2" id="fixed-expenses-settings-list">${state.fixedExpensesList.map((e, idx) => `<div class="flex justify-between items-center text-sm bg-[--bg-color] p-2 rounded border border-[--border-color]"><span>${e.name} (${e.type === 'percent' ? e.value + '%' : '🪙 ' + e.value})</span><button data-action="delete-global-fixed-expense" data-index="${idx}" class="text-red-500"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div>`).join("") || '<p class="text-xs italic text-[--text-secondary]">Nenhum gasto padrão cadastrado.</p>'}</div></section>
                
                <section class="bg-[--card-bg] p-6 rounded-xl border border-[--border-color] space-y-4">
                    <h3 class="font-bold text-lg text-[--sims-green-dark]">Comandos de Sistema</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <button data-action="open-modal" data-modal-type="confirm-zero-balances" class="w-full bg-orange-500 text-white font-bold py-4 rounded-lg shadow hover:bg-orange-600 transition">Zerar Todos os Saldos</button>
                        <button data-action="open-modal" data-modal-type="confirm-reset-central-bank" class="w-full bg-red-600 text-white font-bold py-4 rounded-lg shadow hover:bg-red-700 transition">Resetar Banco Central</button>
                    </div>
                    <button data-action="open-modal" data-modal-type="mass-assign-expense" class="w-full bg-[--sims-green-dark] text-white font-black py-4 rounded-lg shadow hover:opacity-90 transition uppercase tracking-widest flex items-center justify-center gap-2"><i data-lucide="layers"></i> Atribuição de Gasto em Massa</button>
                </section>

                <section class="border-2 border-red-500/50 rounded-lg p-4"><h3 class="font-bold text-lg text-red-500 mb-2">Zona de Perigo</h3><div class="h-64 overflow-y-auto p-2 bg-[--bg-color] rounded-md border border-[--border-color] no-scrollbar">${residentListHTML || '<p class="text-center text-sm italic py-4">Sem registros.</p>'}</div></section>
            </div>`;
        }

        function ResidentProfilePage() {
            const sim = state.residents.find(r => r.id === state.currentResidentId);
            if (!sim) return ErrorPage('Morador não encontrado.', 'dashboard');
            
            const deceasedHeader = sim.isDeceased ? `<div class="bg-red-50 text-red-700 p-4 rounded-lg border border-red-200 mb-4 flex items-center gap-3"><i data-lucide="skull"></i> <div><p class="font-bold">FALECIDO(A)</p><p class="text-xs">Falecimento: ${new Date(sim.deathDate?.seconds * 1000).toLocaleDateString('pt-BR')}</p></div></div>` : "";
            
            const hasWallet = !['Bebê', 'Criança', 'Pré-adolescente'].includes(sim.lifeStage);
            const bal = sim.balance || 0;
            const socialClass = getSocialClass(bal);

            const relationshipsHTML = (sim.relationships || []).map((rel, idx) => {
                const relatedSim = state.residents.find(r => r.id === rel.residentId);
                const tag = relatedSim?.isDeceased ? ' <span class="text-[10px] font-bold text-red-500 uppercase">(Falecido/a)</span>' : "";
                return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]"><span><strong>${rel.type}:</strong> ${relatedSim ? `${relatedSim.firstName} ${relatedSim.lastName}` : 'Desconhecido'} ${tag}</span><button data-action="delete-relationship" data-sim-a-id="${sim.id}" data-rel-index="${idx}" class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div>`;
            }).join("");

            let employmentHTML = '<p class="text-[--text-secondary] italic text-center py-4">Desempregado(a)</p>';
            if (sim.employment && sim.employment.length > 0) {
                employmentHTML = sim.employment.map(job => {
                    const business = state.businesses.find(b => b.id === job.businessId);
                    const branch = state.branches.find(br => br.id === job.branchId);
                    const localStr = branch ? `na filial <strong>${branch.name}</strong>` : `na <strong>Sede</strong>`;
                    const salaryStr = job.salary ? ` | 💸 Salário: ${job.salary.toLocaleString()}` : "";
                    const publicTag = business?.isPublicBody ? '<span class="ml-1 text-[10px] bg-blue-100 text-blue-700 px-1 rounded font-bold uppercase">Público</span>' : '';
                    return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]">
                        <div><p><strong>${job.position}${salaryStr}</strong>${publicTag}</p><p class="text-sm text-[--text-secondary]">${localStr} de <strong class="text-[--sims-green-dark]">${business ? business.name : 'Empresa Desconhecida'}</strong></p></div>
                        <div class="flex gap-1">
                            ${job.branchId ? `<button data-action="open-modal" data-modal-type="edit-branch-job-salary" data-resident-id="${sim.id}" data-business-id="${job.businessId}" data-branch-id="${job.branchId}" class="text-blue-500 p-1"><i data-lucide="edit-3" class="h-4 w-4"></i></button>` : `<button data-action="open-modal" data-modal-type="edit-job-salary" data-resident-id="${sim.id}" data-business-id="${job.businessId}" class="text-blue-500 p-1"><i data-lucide="edit-3" class="h-4 w-4"></i></button>`}
                            <button data-action="open-modal" data-modal-type="remove-employee-reason" data-resident-id="${sim.id}" data-business-id="${job.businessId}" class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50"><i data-lucide="user-minus" class="h-4 w-4"></i></button>
                        </div>
                    </div>`;
                }).join("");
            }

            let fixedExpensesHTML = (sim.fixedExpenses || []).map((exp, idx) => {
                const displayVal = exp.type === 'percent' ? `${exp.value}%` : `🪙 ${exp.value}`;
                return `<div class="p-2 bg-[--bg-color] rounded border border-[--border-color] flex justify-between items-center"><span>${exp.name}: ${displayVal}</span><button data-action="delete-fixed-expense-resident" data-id="${sim.id}" data-index="${idx}" class="text-red-500"><i data-lucide="x" class="h-4 w-4"></i></button></div>`;
            }).join("");

            const mySubs = state.subscriptions.filter(s => s.subscriberId === sim.id);
            const subscriptionsHTML = mySubs.map(sub => {
                const provider = state.businesses.find(b => b.id === sub.providerId);
                return `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color] mb-1">
                    <div><p class="font-bold text-xs uppercase">${sub.planName}</p><p class="text-xs text-[--text-secondary]">Fornecedor: ${provider?.name || 'Desconhecido'}</p></div>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-bold text-red-500">🪙 -${sub.planValue}</span>
                        <button data-action="cancel-subscription" data-id="${sub.id}" class="text-gray-400 hover:text-red-500"><i data-lucide="x-circle" class="h-4 w-4"></i></button>
                    </div>
                </div>`;
            }).join("");

            let politicsHTML = "";
            if (sim.governmentRole) {
                const ministryId = Object.keys(state.government.roles).find(k => state.government.roles[k] === sim.id);
                const sal = state.government.salaries?.[ministryId] || 0;
                politicsHTML += `<p><strong class="block text-sm text-[--text-secondary]">Cargo Público:</strong> ${sim.governmentRole} <span class="text-xs font-bold text-green-600">(Salário Pago pelo Tesouro: 🪙 ${sal.toLocaleString()})</span></p>`;
            }
            if (sim.councilRoles && sim.councilRoles.length > 0) {
                sim.councilRoles.forEach(role => {
                    politicsHTML += `<p class="mt-2"><strong class="block text-sm text-[--text-secondary]">${role.role} do(a):</strong> ${role.councilName}</p>`;
                });
            }
            if (sim.partyId) {
                const party = state.parties.find(p => p.id === sim.partyId);
                politicsHTML += `<p class="mt-2"><strong class="block text-sm text-[--text-secondary]">Partido:</strong> ${party ? party.name : 'Desconhecido'}</p>`;
            }
            if (!politicsHTML) politicsHTML = '<p class="text-[--text-secondary] italic">Nenhuma afiliação política.</p>';

            const region = state.regions.find(r => r.id === sim.regionId);
            const educationHTML = (sim.education || []).map(edu => {
                const business = state.businesses.find(b => b.id === edu.businessId);
                return `<div class="p-3 bg-[--bg-color] rounded-md border border-[--border-color]"><p class="font-semibold">${edu.course}</p><p class="text-sm text-[--text-secondary]">${business ? business.name : 'Instituição Desconhecida'}</p><p class="text-xs font-bold uppercase mt-2 ${edu.status === 'Cursando' ? 'text-blue-500' : edu.status === 'Formado(a)' ? 'text-green-500' : 'text-red-500'}">${edu.status}</p></div>`;
            }).join("");

            const myLoans = state.loans.filter(l => l.borrowerId === sim.id);
            const loansHTML = myLoans.map(loan => {
                const bank = state.businesses.find(b => b.id === loan.bankId);
                return `<div class="p-3 bg-[--bg-color] rounded-md border border-[--border-color] mb-2">
                    <div class="flex justify-between items-center mb-1">
                        <span class="font-bold text-sm">${bank?.name || 'Banco'}</span>
                        <span class="text-xs bg-red-100 text-red-700 px-2 py-0.5 rounded-full font-bold">🪙 ${loan.remainingAmount.toLocaleString()} pendente</span>

                    <div class="flex justify-between text-[10px] text-[--text-secondary] uppercase font-bold">

                    </div>

            const history = (sim.history || []).sort((a, b) => (a.date?.seconds || 0) - (b.date?.seconds || 0));
            const historyHTML = history.map(entry => `<div class="p-3 bg-[--bg-color] rounded-md flex justify-between items-center border border-[--border-color]"><div><p><strong>${entry.status}</strong></p><p class="text-sm text-[--text-secondary]">${entry.type === 'job' ? 'da empresa' : 'do cargo de'} <strong>${entry.location}</strong></p></div><button data-action="delete-history-entry" data-resident-id="${sim.id}" data-history-id="${entry.id}" class="text-red-500 hover:text-red-700 p-1 rounded-full hover:bg-red-100 dark:hover:bg-red-900/50"><i data-lucide="trash-2" class="h-4 w-4"></i></button></div>`).join("");

            let financeSectionHTML = "";
            if (hasWallet) {
                financeSectionHTML = `
                <div class="bg-[--card-bg] p-4 rounded-lg shadow-sm border border-[--border-color]">
                    <h3 class="font-semibold text-lg mb-4 flex items-center gap-2"><i data-lucide="wallet" class="h-5 w-5 text-[--finance-gold]"></i> Finanças Pessoais</h3>
                    <div class="flex items-center justify-between mb-4 p-3 bg-[--bg-color] rounded-lg">
                        <div>
                            <p class="text-xs text-[--text-secondary] uppercase font-bold tracking-wider">Saldo Atual</p>
                            <p class="text-2xl font-black ${bal < 0 ? 'negative-balance' : 'text-[--sims-green-dark]'}">🪙 ${bal.toLocaleString()}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-xs text-[--text-secondary] uppercase font-bold tracking-wider">Classe Social</p>
                            <span class="inline-block px-3 py-1 rounded-full text-white text-[10px] font-bold uppercase ${socialClass.color}">${socialClass.label}</span>
                        </div>
                    </div>
                    <div class="grid grid-cols-2 gap-3 mb-4">
                        <button data-action="open-modal" data-modal-type="inject-capital" data-id="${sim.id}" class="bg-green-100 text-green-700 py-3 rounded-lg font-bold text-sm flex items-center justify-center gap-2 hover:bg-green-200 transition">
                            <i data-lucide="trending-up" class="h-4 w-4"></i> Injetar Capital
                        </button>
                        <button data-action="open-modal" data-modal-type="register-expense" data-id="${sim.id}" class="bg-red-100 text-red-700 py-3 rounded-lg font-bold text-sm flex items-center justify-center gap-2 hover:bg-red-200 transition">
                            <i data-lucide="trending-down" class="h-4 w-4"></i> Registrar Gasto
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                        <button data-action="open-modal" data-modal-type="transfer-sim-to-sim" data-id="${sim.id}" class="bg-blue-100 text-blue-700 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 uppercase">
                            <i data-lucide="send" class="h-3 w-3"></i> Enviar p/ Sim
                        </button>
                        <button data-action="open-modal" data-modal-type="transfer-sim-to-biz" data-id="${sim.id}" class="bg-purple-100 text-purple-700 py-2 rounded-lg font-bold text-xs flex items-center justify-center gap-2 uppercase">
                            <i data-lucide="building" class="h-3 w-3"></i> Investir em Empresa
                        </button>
                    </div>

                    <div class="border-t border-[--border-color] pt-4 mb-4">
                        <div class="flex justify-between items-center mb-3"><h4 class="text-sm font-bold uppercase text-[--text-secondary]">Assinaturas Ativas</h4></div>
                        <div class="space-y-1">${subscriptionsHTML || '<p class="text-xs italic text-gray-400">Nenhum contrato ativo.</p>'}</div>
                    </div>

                    <div class="border-t border-[--border-color] pt-4 mb-4">
                        <div class="flex justify-between items-center mb-3"><h4 class="text-sm font-bold uppercase text-[--text-secondary]">Empréstimos Ativos</h4></div>
                        <div class="space-y-1">${loansHTML || '<p class="text-xs italic text-gray-400">Nenhum empréstimo ativo.</p>'}</div>
                    </div>

        const HeaderComponent = (title, subtitle, version) => `<div class="flex justify-between items-center"><div class="flex items-center gap-3"><svg width="32" height="32" viewBox="0 0 100 100" class="fill-current text-[--sims-green-vibrant]"><path d="M50 0 L100 50 L50 100 L0 50 Z"></path></svg><h1 class="text-3xl md:text-4xl font-extrabold text-[--sims-green-dark]">${title}</h1></div><div class="flex items-center space-x-3"><span class="text-xs font-mono text-[--text-secondary] bg-[--border-color] px-2 py-1 rounded-md">${version}</span><button data-action="toggle-dark-mode" class="text-[--text-secondary] hover:text-[--text-primary]">${document.documentElement.classList.contains('dark') ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>'}</button></div></div><p class="text-[--text-secondary] mt-1 font-medium">${subtitle}</p>`;

        const FABComponent = (modalType) => `<button data-action="open-modal" data-modal-type="${modalType}" class="fixed bottom-24 right-6 bg-[--sims-green-vibrant] text-white p-4 rounded-full shadow-lg hover:bg-green-500 transition-transform transform hover:scale-110 z-30"><i data-lucide="plus" class="h-6 w-6"></i></button>`;

        const createReasonRadios = (name, reasons) => `<div class="space-y-2">${reasons.map((reason, index) => `<div><input type="radio" name="${name}" value="${reason}" id="${name}-${index}" class="hidden peer" ${index === 0 ? 'checked' : ""} required><label for="${name}-${index}" class="reason-radio-label peer-checked:bg-[--sims-green-dark] peer-checked:text-white">${reason}</label></div>`).join("")}</div>`;

            switch (modalType) {

            const modalHTML = `<div id="modal-backdrop" class="fixed inset-0 bg-black/60 z-40 modal opacity-0" data-action="close-modal"><div id="modal-content" class="absolute bottom-0 left-0 right-0 bg-[--card-bg] p-6 rounded-t-2xl shadow-lg max-h-[85vh] overflow-y-auto no-scrollbar transform translate-y-full opacity-0" data-action="ignore"><div class="flex justify-between items-center mb-4"><h2 class="text-2xl font-bold text-[--sims-green-dark]">${title}</h2><button data-action="close-modal" class="text-[--text-secondary] hover:text-[--text-primary]">&times;</button></div><form id="${formId}" data-action="${submitAction}" data-id="${dataId || ""}">${contentHTML}</form></div></div>`;

            setTimeout(() => {

                if (modalType === 'start-election-setup') {

                if (modalType === 'add-business' || modalType === 'edit-business') {
